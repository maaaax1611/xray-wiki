<body>
<main class="widget">
<figure class="fig">
<div class="two">
<div><div class="lbl">Original (96 × 96)</div><canvas aria-label="Testbild" class="c-sq" id="cv-img0" role="img"></canvas></div>
<div><div class="lbl" id="img-lbl">Rang k</div><canvas aria-label="Rang-k-Approximation des Testbilds" class="c-sq" id="cv-img1" role="img"></canvas></div>
</div>
<canvas aria-label="Singulärwerte des Testbilds auf logarithmischer Skala" class="c-sv" id="cv-sv" role="img"></canvas>
<div class="ctrls">
<div class="ctrl"><div class="lab"><label for="img-k">Rang k</label><output id="img-k-o"></output></div><input autocomplete="off" id="img-k" max="96" min="1" step="1" type="range" value="8"/></div>
<div class="ctrl"><div class="lab"><label for="img-n">Rauschen im Bild</label><output id="img-n-o"></output></div><input autocomplete="off" id="img-n" max="0.3" min="0" step="0.01" type="range" value="0"/></div>
</div>
<div class="readout" id="img-read"></div>
<figcaption><b>Abb. 11</b> Rang-k-Approximation eines Testbilds. Unten die Singulärwerte, logarithmisch. Horizontale und vertikale Strukturen sind schon mit wenigen Termen da, schräge Kanten und Kreise brauchen viele. Mit Rauschen bekommen alle Singulärwerte einen Boden: Ab dort trägt jeder weitere Term mehr Rauschen als Bild bei, und ein kleiner Rang wirkt als Entrauscher.</figcaption>
</figure>
</main>
<script src="../assets/ui.js"></script>
<script src="../assets/la.js"></script>
<script>
/* ---------- Bildkompression mit SVD ---------- */
(() => {
  const n = 96, c0 = $('#cv-img0'), c1 = $('#cv-img1'), cs = $('#cv-sv'), iK = $('#img-k'), iN = $('#img-n');
  const clean = new Float64Array(n * n);
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
    const x = j / (n - 1), y = i / (n - 1);
    let v = 0.15 + 0.25 * x;
    if (x > 0.08 && x < 0.45 && y > 0.1 && y < 0.38) v = 0.85;                       // Rechteck
    if (y > 0.5 && y < 0.56 && x > 0.05 && x < 0.95) v = 0.95;                                                   // waagrechter Balken
    if ((x - 0.7) ** 2 + (y - 0.3) ** 2 < 0.035) v = 0.65;                               // Kreis
    if (Math.abs((x - 0.15) - (y - 0.62)) < 0.035 && y > 0.62 && y < 0.95) v = 0.9;      // Diagonale
    if (x > 0.55 && x < 0.95 && y > 0.65 && y < 0.92) v = 0.35 + 0.3 * (Math.floor(x * 20) % 2); // Streifen
    clean[i * n + j] = v;
  }
  seed = 11; const noise = Float64Array.from({ length: n * n }, () => gauss());
  let A = null, svals = [], AV = null, V = null, lastNoise = -1;
  function decompose() {
    const sg = +iN.value; if (sg === lastNoise) return; lastNoise = sg;
    A = clean.map((v, k) => v + sg * noise[k]);
    const S = new Float64Array(n * n);
    for (let p = 0; p < n; p++) for (let q = p; q < n; q++) { let s = 0; for (let i = 0; i < n; i++) s += A[i * n + p] * A[i * n + q]; S[p * n + q] = S[q * n + p] = s; }
    const E = jacobiEig(S, n);
    svals = E.val.map(v => Math.sqrt(Math.max(0, v))); V = E.vec;
    AV = V.map(v => { const r = new Float64Array(n); for (let i = 0; i < n; i++) { let s = 0; for (let j = 0; j < n; j++) s += A[i * n + j] * v[j]; r[i] = s; } return r; });
  }
  function paint(c, img) {
    const { ctx, w, h } = fit(c);
    const off = document.createElement('canvas'); off.width = n; off.height = n; const o = off.getContext('2d'), id = o.createImageData(n, n);
    for (let k = 0; k < n * n; k++) { const g = Math.max(0, Math.min(255, Math.round(img[k] * 255))); id.data[4 * k] = id.data[4 * k + 1] = id.data[4 * k + 2] = g; id.data[4 * k + 3] = 255; }
    o.putImageData(id, 0, 0); ctx.imageSmoothingEnabled = false; const s = Math.min(w, h); ctx.drawImage(off, (w - s) / 2, (h - s) / 2, s, s);
  }
  const m = reg({ el: c1, draw() {
    decompose();
    const k = +iK.value; $('#img-k-o').textContent = k; $('#img-n-o').textContent = nf(+iN.value, 2); $('#img-lbl').textContent = `Rang k = ${k}`;
    const Ak = new Float64Array(n * n);
    for (let r = 0; r < k; r++) { const av = AV[r], v = V[r]; for (let i = 0; i < n; i++) { const a = av[i]; if (a === 0) continue; for (let j = 0; j < n; j++) Ak[i * n + j] += a * v[j]; } }
    paint(c0, A); paint(c1, Ak);
    let e2 = 0, ec = 0, nc = 0; for (let q = 0; q < n * n; q++) { e2 += (A[q] - Ak[q]) ** 2; ec += (clean[q] - Ak[q]) ** 2; nc += clean[q] ** 2; }
    const tot = svals.reduce((s, v) => s + v * v, 0), kept = svals.slice(0, k).reduce((s, v) => s + v * v, 0);
    // Singulärwerte
    const { ctx, w, h } = fit(cs);
    const smin = Math.max(1e-3, Math.min(...svals.filter(v => v > 0))), smax = svals[0];
    const y0 = Math.pow(10, Math.floor(Math.log10(Math.max(smin, smax * 1e-6)))), y1 = Math.pow(10, Math.ceil(Math.log10(smax)));
    const yt = []; for (let v = y0; v <= y1 * 1.0001; v *= 10) yt.push(v);
    const fr = frame(ctx, 0, 0, w, h, { x0: 0, x1: n + 1, y0, y1, ylog: true, xt: [1, 16, 32, 48, 64, 80, 96], yt, yf: v => ex(v, 0), xl: 'Index i', yl: 'σᵢ', l: 52, b: 34 });
    const bw = Math.max(1, fr.bw / (n + 1) * 0.7);
    svals.forEach((s, i) => { const x = fr.X(i + 1), y = fr.Y(Math.max(y0, s)); ctx.fillStyle = i < k ? tok('--accent') : rgba(tok('--muted'), 0.5); ctx.fillRect(x - bw / 2, y, bw, fr.by + fr.bh - y); });
    $('#img-read').innerHTML = `<span class="k">Erhaltene Energie Σσ²(i≤k)/Σσ²:</span> ${nf(100 * kept / tot, 2)} %  <span class="k">Fehler zur Vorlage ‖A − A_k‖_F/‖A‖_F:</span> ${nf(100 * Math.sqrt(e2 / tot), 1)} %<br><span class="k">Speicher:</span> k·(m + n + 1) = ${k * (2 * n + 1)} statt m·n = ${n * n} Zahlen (${nf(100 * k * (2 * n + 1) / (n * n), 0)} %)` + (+iN.value > 0 ? `  <span class="k">Fehler zum rauschfreien Bild:</span> <b>${nf(100 * Math.sqrt(ec / nc), 1)} %</b>` : '');
  } });
  reg({ el: cs, draw: () => {} });
  iK.addEventListener('input', rafDebounce(() => m.draw()));
  iN.addEventListener('input', rafDebounce(() => m.draw()));
})();
</script>
</body>
</html>
