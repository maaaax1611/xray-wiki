<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Attention Schritt für Schritt</title>
<!-- Erzeugt von build.py aus src/figures/tr-03-attention-rechner.html. Nicht von Hand bearbeiten. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@400;500&display=swap">
<script>
window.MathJax = {
  tex: { inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]'], ['$$', '$$']] },
  svg: { fontCache: 'global' },
  options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'canvas', 'svg'] }
};
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.min.js" async></script>
<link rel="stylesheet" href="../assets/page.css">
<link rel="stylesheet" href="../assets/tr.css">
<script>try{var p=new URLSearchParams(location.search),t=p.get("theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);if(p.get("frame")==="0")document.documentElement.classList.add("noframe");}catch(e){}</script>
</head>
<body>
<main class="widget">
<figure class="fig">
  <canvas id="cv-att" class="c-tr-wide" tabindex="0" role="img" aria-label="Links die Attention-Matrix für sechs Tokens, rechts die Value-Vektoren als Punkte und die Ausgabe des gewählten Tokens als gewichteter Mittelwert."></canvas>
  <div class="ctrls">
    <div class="ctrl" style="flex:0 1 170px"><div class="lab"><label for="att-q">Query-Token</label></div><select id="att-q" autocomplete="off"></select></div>
    <div class="ctrl" style="flex:0 1 210px"><div class="lab"><label for="att-m">Matrix zeigt</label></div><select id="att-m" autocomplete="off"><option value="w">Gewichte (nach Softmax)</option><option value="s">Werte QKᵀ/√d_k</option></select></div>
    <div class="ctrl"><div class="lab"><label for="att-t">Temperatur</label><output id="att-t-o"></output></div><input id="att-t" type="range" min="-2" max="2" step="0.05" value="0" autocomplete="off"></div>
  </div>
  <div class="readout" id="att-read"></div>
  <figcaption><b>Abb. 3</b> Attention für den Satz „Die Katze sitzt auf der Matte“ mit von Hand gewählten Queries und Keys (\(d_k = 4\)). Jede Zeile der Matrix gehört zu einer Query und summiert sich zu 1. Rechts liegen die Values als Punkte, die Ausgabe \(\mathbf y_i\) (Raute) ist ihr gewichteter Mittelwert und liegt deshalb immer innerhalb ihrer Hülle. Die Linienstärke zeigt das Gewicht. Ein Klick in eine Zeile wählt die Query. Bei kleiner Temperatur rückt die Ausgabe auf den stärksten Value, bei großer in die Mitte.</figcaption>
</figure>
</main>
<script src="../assets/ui.js"></script>
<script src="../assets/tr.js"></script>
<script>
/* ---------- Attention-Rechner ---------- */
(() => {
  const c = $('#cv-att'), iq = $('#att-q'), im = $('#att-m'), it = $('#att-t');
  iq.innerHTML = TR_TOKENS.map((t, i) => `<option value="${i}">${t}</option>`).join(''); iq.value = 2;
  let hm = null, cell = 0;
  const m = reg({ el: c, draw() {
    const T = Math.pow(2, +it.value); $('#att-t-o').textContent = nf(T, 2);
    const S = trScores(true), A = S.map(r => softmax(r, T)), qi = +iq.value;
    const { ctx, w, h } = fit(c);
    const narrow = w < 560, hmSize = narrow ? Math.min(w - 70, h * 0.48) : Math.min(h - 40, w * 0.48);
    cell = Math.floor(hmSize / 6);
    const show = im.value === 'w' ? A : S, smax = Math.max(...S.flat());
    hm = heatmap(ctx, show, { x: 8, y: 28, cell, rows: TR_TOKENS.map(t => t + ' →'), cols: TR_TOKENS, lw: 64, th: 18, hl: { i: qi },
      fmt: v => nf(v, 2), color: v => im.value === 'w' ? heat(v) : heat(v / smax, tok('--bin2')) });
    ctx.fillStyle = tok('--fg'); ctx.font = `600 13px ${DISP}`; ctx.textAlign = 'left';
    ctx.fillText(im.value === 'w' ? 'Gewichte a = softmax(QKᵀ/√d_k)' : 'Werte QKᵀ/√d_k', 8, 14);
    // Value-Ebene
    const px = narrow ? 8 : hm.x0 + hm.w + 30, py = narrow ? hm.y0 + hm.h + 16 : 20, pw = w - px - 8, ph = narrow ? h - py - 8 : h - 28;
    const R = 2.2, s = Math.min(pw * 0.62, ph) / (2 * R), cx = px + pw / 2, cy = py + ph / 2, P = (x, y) => [cx + x * s, cy - y * s];
    ctx.strokeStyle = tok('--grid'); ctx.lineWidth = 1; ctx.strokeRect(cx - R * s, cy - R * s, 2 * R * s, 2 * R * s);
    ctx.fillStyle = tok('--fg'); ctx.font = `600 13px ${DISP}`; ctx.fillText('Values und Ausgabe', cx - R * s, cy - R * s - 6);
    const a = A[qi], y = [0, 0]; TR_V.forEach((v, j) => { y[0] += a[j] * v[0]; y[1] += a[j] * v[1]; });
    const [yx, yy] = P(...y);
    TR_V.forEach((v, j) => { const [vx, vy] = P(...v); ctx.strokeStyle = rgba(tok('--accent'), 0.85); ctx.lineWidth = 0.5 + 9 * a[j]; ctx.beginPath(); ctx.moveTo(vx, vy); ctx.lineTo(yx, yy); ctx.stroke(); });
    TR_V.forEach((v, j) => { const [vx, vy] = P(...v); ctx.fillStyle = tok('--muted'); ctx.beginPath(); ctx.arc(vx, vy, 5, 0, 7); ctx.fill();
      ctx.font = `13px ${DISP}`; ctx.fillStyle = tok('--fg'); ctx.textAlign = v[0] > 0 ? 'left' : 'right'; ctx.fillText(`v(${TR_TOKENS[j]})  ${nf(a[j], 2)}`, vx + (v[0] > 0 ? 9 : -9), vy - 7); });
    ctx.fillStyle = tok('--bin2'); ctx.beginPath(); ctx.moveTo(yx, yy - 9); ctx.lineTo(yx + 9, yy); ctx.lineTo(yx, yy + 9); ctx.lineTo(yx - 9, yy); ctx.closePath(); ctx.fill();
    ctx.font = `700 13px ${DISP}`; ctx.fillStyle = tok('--fg'); ctx.textAlign = 'left'; ctx.fillText(`y(${TR_TOKENS[qi]})`, yx + 12, yy + 16);
    const order = a.map((v, j) => [v, j]).sort((p, q) => q[0] - p[0]);
    $('#att-read').innerHTML = `<span class="k">q(${TR_TOKENS[qi]}) =</span> (${TR_Q[qi].map(v => nf(v, 1)).join('; ')})  <span class="k">·</span>  <span class="k">stärkste Gewichte:</span> ${order.slice(0, 3).map(([v, j]) => `${TR_TOKENS[j]} <b>${nf(v, 2)}</b>`).join(', ')}<br>` +
      `<span class="k">y = Σ aⱼ vⱼ =</span> (${nf(y[0], 2)}; ${nf(y[1], 2)})  <span class="k">·</span>  <span class="k">Entropie der Zeile:</span> ${nf(entropy(a), 2)} bit (gleichverteilt: ${nf(Math.log2(6), 2)} bit)`;
  } });
  c.addEventListener('click', e => { if (!hm) return; const [x, y] = mouse(c, e); const hit = cellAt(hm, cell, x, y) || (x < hm.x0 && y > hm.y0 && y < hm.y0 + hm.h ? { i: Math.floor((y - hm.y0) / cell) } : null); if (hit) { iq.value = hit.i; m.draw(); } });
  [iq, im, it].forEach(e => e.addEventListener('input', () => m.draw()));
})();
</script>
</body>
</html>
