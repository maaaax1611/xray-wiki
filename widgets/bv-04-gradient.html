<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sobel-Gradient</title>
<!-- Erzeugt von build.py aus src/figures/bv-04-gradient.html. Nicht von Hand bearbeiten. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@400;500&display=swap">
<script>
window.MathJax = {
  tex: { inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]'], ['$$', '$$']] },
  svg: { fontCache: 'global' },
  options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'canvas', 'svg'] }
};
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.min.js" async></script>
<link rel="stylesheet" href="../assets/page.css">
<link rel="stylesheet" href="../assets/bv.css">
<script>try{var p=new URLSearchParams(location.search),t=p.get("theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);if(p.get("frame")==="0")document.documentElement.classList.add("noframe");}catch(e){}</script>
</head>
<body>
<main class="widget">
<figure class="fig">
  <canvas id="cv-gr" class="c-bv-4" tabindex="0" role="img" aria-label="Testbild, horizontale und vertikale Sobel-Ableitung und Gradientenbetrag. An einem gewählten Pixel ist der Gradient als Pfeil eingezeichnet."></canvas>
  <div class="ctrls">
    <div class="ctrl"><div class="lab"><label for="gr-s">Vorglättung σ</label><output id="gr-s-o"></output></div><input id="gr-s" type="range" min="0" max="3" step="0.25" value="0" autocomplete="off"></div>
    <div class="ctrl"><div class="lab"><label for="gr-n">Rauschen</label><output id="gr-n-o"></output></div><input id="gr-n" type="range" min="0" max="0.15" step="0.01" value="0" autocomplete="off"></div>
  </div>
  <div class="readout" id="gr-read"></div>
  <figcaption><b>Abb. 4</b> Der Sobel-Operator schätzt die Ableitung in x- und y-Richtung (blau positiv, rot negativ). Senkrechte Kanten erscheinen nur in Gx, waagrechte nur in Gy, schräge in beiden. Der Betrag \(\sqrt{G_x^2 + G_y^2}\) ist unabhängig von der Richtung und zeigt alle Kanten. Ein Klick in ein Bild setzt den Messpunkt, der Pfeil zeigt in Richtung des steilsten Anstiegs. Mit Rauschen werden die Ableitungen schnell unbrauchbar, weil Ableiten hohe Frequenzen verstärkt. Vorher zu glätten hilft.</figcaption>
</figure>
</main>
<script src="../assets/ui.js"></script>
<script src="../assets/bv.js"></script>
<script>
/* ---------- Gradient ---------- */
(() => {
  const c = $('#cv-gr'), is = $('#gr-s'), inz = $('#gr-n'), n = BV_N;
  let key = '', R = null, L = null, probe = [54, 22];
  const m = reg({ el: c, draw() {
    const s = +is.value, a = +inz.value; $('#gr-s-o').textContent = nf(s, 2) + ' px'; $('#gr-n-o').textContent = nf(a, 2);
    const k = `${s}|${a}`;
    if (k !== key) { key = k; const I = gaussBlur(addNoise(BV_PH, a), n, s), { gx, gy } = sobel(I, n), mag = new Float32Array(n * n);
      for (let q = 0; q < n * n; q++) mag[q] = Math.hypot(gx[q], gy[q]); R = { I, gx, gy, mag, max: Math.max(...mag) }; }
    const { ctx, w, h } = fit(c); L = imgLayout(w, h, 4);
    drawImg(ctx, R.I, n, L[0].x, L[0].y, L[0].size, { title: 'Bild' });
    drawImg(ctx, R.gx, n, L[1].x, L[1].y, L[1].size, { title: 'Gx', sym: true, hi: R.max * 0.7 });
    drawImg(ctx, R.gy, n, L[2].x, L[2].y, L[2].size, { title: 'Gy', sym: true, hi: R.max * 0.7 });
    drawImg(ctx, R.mag, n, L[3].x, L[3].y, L[3].size, { title: 'Betrag', hi: R.max * 0.8 });
    const [px, py] = probe, q = py * n + px, gx = R.gx[q], gy = R.gy[q], mg = R.mag[q];
    L.forEach(l => { const sc = l.size / n, x = l.x + (px + 0.5) * sc, y = l.y + (py + 0.5) * sc;
      ctx.strokeStyle = tok('--bin2'); ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(x, y, 5, 0, 7); ctx.stroke();
      if (mg > 1e-3) { const len = Math.min(l.size * 0.25, 10 + 60 * mg / R.max); arrowPx(ctx, x, y, x + gx / mg * len, y + gy / mg * len, tok('--bin2'), 2); } });
    const ang = (Math.atan2(-gy, gx) * 180 / Math.PI + 360) % 360;
    $('#gr-read').innerHTML = `<span class="k">Pixel (${px}, ${py}):</span> Gx = ${nf(gx, 3)}, Gy = ${nf(gy, 3)}  <span class="k">·</span>  <span class="k">Betrag:</span> <b>${nf(mg, 3)}</b>  <span class="k">·</span>  <span class="k">Richtung:</span> ${mg > 1e-3 ? nf(ang, 0) + '° (0° = nach rechts, gegen den Uhrzeigersinn)' : 'keine, flache Stelle'}`;
  } });
  c.addEventListener('click', e => { if (!L) return; const [x, y] = mouse(c, e);
    for (const l of L) if (x >= l.x && x < l.x + l.size && y >= l.y && y < l.y + l.size) { probe = [Math.floor((x - l.x) / l.size * n), Math.floor((y - l.y) / l.size * n)]; m.draw(); return; } });
  [is, inz].forEach(e => e.addEventListener('input', rafDebounce(() => m.draw())));
})();
</script>
</body>
</html>
