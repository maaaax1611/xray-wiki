<figcaption><b>Abb. 2</b> Links: Im Szintillator wird das Quant in Licht umgewandelt, das sich ausbreitet und über Septen auf ein Pixel begrenzt wird. Die Photodiode integriert. Rechts: Im Halbleiter erzeugt das Quant direkt Elektron-Loch-Paare. Das Feld zieht die Elektronen zur Pixelanode, jedes Photon erzeugt einen eigenen Strompuls. Die Pixel sind nur durch die Elektrodenstruktur definiert.</figcaption>
