<meta charset="utf-8">

<title>Gleichungssystem und Kondition</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@400;500&display=swap">
<script>
window.MathJax = {
  tex: { inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]'], ['$$', '$$']] },
  svg: { fontCache: 'global' },
  options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'canvas', 'svg'] }

</head>
<body>
<main class="widget">
<figure class="fig">
<canvas aria-label="Zwei Geraden, deren Schnittpunkt die Lösung eines 2×2-Gleichungssystems ist. Bei verrauschter rechter Seite streuen die Lösungen; je flacher der Schnittwinkel, desto stärker." class="c-pl" id="cv-lgs" role="img"></canvas>
<div class="ctrls">
<div class="ctrl"><div class="lab"><label for="lgs-a">Winkel zwischen den Geraden</label><output id="lgs-a-o"></output></div><input autocomplete="off" id="lgs-a" max="90" min="1" step="0.5" type="range" value="60"/></div>
<div class="ctrl"><div class="lab"><label for="lgs-n">Rauschen auf b (σ)</label><output id="lgs-n-o"></output></div><input autocomplete="off" id="lgs-n" max="0.2" min="0" step="0.005" type="range" value="0.05"/></div>
<button class="btn" id="lgs-re" type="button">Neu würfeln</button>
</div>
<div class="readout" id="lgs-read"></div>
<figcaption><b>Abb. 5</b> Jede Gleichung des Systems ist eine Gerade, die Lösung ist ihr Schnittpunkt. Die Punktwolke zeigt 400 Lösungen mit jeweils neu verrauschtem \(\mathbf b\). Schneiden sich die Geraden steil, bleibt die Wolke klein. Je flacher der Winkel, desto größer \(\kappa\) und desto weiter streut die Lösung entlang der Geraden, obwohl das Rauschen gleich bleibt.</figcaption>
</figure>
</main>
<script src="../assets/ui.js"></script>
<script src="../assets/la.js"></script>
<script>
/* ---------- Gleichungssystem und Kondition ---------- */
(() => {
  const c = $('#cv-lgs'), iA = $('#lgs-a'), iN = $('#lgs-n');
  const xs = [0.4, 0.3], th1 = 12 * Math.PI / 180;
  let eps = [];
  const roll = () => { seed = Math.floor(Math.random() * 1e6) + 1; eps = Array.from({ length: 400 }, () => [gauss(), gauss()]); };
  roll();
  const m = reg({ el: c, draw() {
    const dA = +iA.value * Math.PI / 180, th2 = th1 + dA, sg = +iN.value;
    $('#lgs-a-o').textContent = nf(+iA.value, 1) + '°'; $('#lgs-n-o').textContent = nf(sg, 3);
    const M = [-Math.sin(th1), Math.cos(th1), -Math.sin(th2), Math.cos(th2)];
    const b = mul(M, ...xs), D = det2(M), inv = [M[3] / D, -M[1] / D, -M[2] / D, M[0] / D];
    const P = plane(c, 2.6, 0.3, 0.2); grid(P);
    const A = tok('--accent'), G = tok('--bin2'), Mu = tok('--muted'), Fg = tok('--fg');
    // Lösungswolke
    let sx = 0, sy = 0, sxx = 0, syy = 0;
    P.ctx.fillStyle = rgba(Mu, 0.45);
    for (const [e1, e2] of eps) {
      const [x, y] = mul(inv, b[0] + sg * e1, b[1] + sg * e2);
      const dx = x - xs[0], dy = y - xs[1]; sxx += dx * dx; syy += dy * dy;
      const [px, py] = P.S(x, y); P.ctx.fillRect(px - 1.3, py - 1.3, 2.6, 2.6);
    }
    const spread = Math.sqrt((sxx + syy) / eps.length);
    const L = 8;
    for (const [th, col, nm] of [[th1, A, 'Gleichung 1'], [th2, G, 'Gleichung 2']]) {
      const dx = Math.cos(th), dy = Math.sin(th);
      if (sg > 0) { const nx = -dy, ny = dx; poly(P, [[xs[0] - L * dx + sg * nx, xs[1] - L * dy + sg * ny], [xs[0] + L * dx + sg * nx, xs[1] + L * dy + sg * ny], [xs[0] + L * dx - sg * nx, xs[1] + L * dy - sg * ny], [xs[0] - L * dx - sg * nx, xs[1] - L * dy - sg * ny]], true); P.ctx.fillStyle = rgba(col, 0.12); P.ctx.fill(); }
      line(P, xs[0] - L * dx, xs[1] - L * dy, xs[0] + L * dx, xs[1] + L * dy, col, 2.2);
      label(P, xs[0] + 2.0 * dx, xs[1] + 2.0 * dy, nm, col, 6, -8, `600 13px ${DISP}`);
    }
    dot(P, ...xs, Fg, 4.5);
    const s = svd2(M), kap = s.s[0] / s.s[1];
    $('#lgs-read').innerHTML = `<span class="k">A =</span> ${fmtM(M)}  <span class="k">σ₁ =</span> ${nf(s.s[0], 3)}  <span class="k">σ₂ =</span> ${nf(s.s[1], 3)}  <span class="k">κ(A) =</span> <b>${nf(kap, kap < 10 ? 2 : kap < 100 ? 1 : 0)}</b>  <span class="k">det A =</span> ${nf(D, 3)}<br><span class="k">Streuung der Lösung (RMS):</span> ${nf(spread, 3)}${sg > 0 ? `, das ${nf(spread / (sg * Math.SQRT2), 1)}-Fache des Rauschens auf b` : ''}`;
  } });
  [iA, iN].forEach(e => e.addEventListener('input', () => m.draw()));
  $('#lgs-re').addEventListener('click', () => { roll(); m.draw(); });
})();
</script>
</body>
</html>
