<title>LoRA: Anpassung mit niedrigem Rang</title>

<body>
<main class="widget">
<figure class="fig">
  <canvas id="cv-lora" class="c-tr-wide" role="img" aria-label="Die nötige Änderung einer Gewichtsmatrix, ihre beste Näherung als Produkt B mal A mit Rang r, und der verbleibende Fehler."></canvas>
  <div class="ctrls">
    <div class="ctrl"><div class="lab"><label for="lora-r">Rang r</label><output id="lora-r-o"></output></div><input id="lora-r" type="range" min="1" max="12" step="1" value="2" autocomplete="off"></div>
    <div class="ctrl"><div class="lab"><label for="lora-d">echte Größe d = k</label><output id="lora-d-o"></output></div><input id="lora-d" type="range" min="8" max="14" step="1" value="12" autocomplete="off"></div>
    <button class="btn" type="button" id="lora-re">Neue Zieländerung</button>
  </div>
  <div class="readout" id="lora-read"></div>
  <figcaption><b>Abb. 12</b> Eine ausgedachte Änderung \(\Delta W\) einer 24 × 24-Gewichtsmatrix, wie sie vollständiges Fine-Tuning ergeben würde: im Wesentlichen Rang 3 plus etwas Rauschen. LoRA lernt stattdessen \(BA\) mit Rang \(r\). Gezeigt ist die bestmögliche Näherung dieses Rangs (über die Singulärwertzerlegung) und der Rest. Schon \(r = 3\) erfasst fast alles. Der zweite Regler rechnet die Parameterzahl für eine echte Matrixgröße aus.</figcaption>
</figure>
</main>
<script src="../assets/ui.js"></script>
<script src="../assets/tr.js"></script>
<script>
/* ---------- LoRA ---------- */
(() => {
  const c = $('#cv-lora'), ir = $('#lora-r'), id = $('#lora-d'), n = 24;
  let T, U, s, Vt;
  function gen() {
    const comps = [[1.0], [0.7], [0.45]].map(([a]) => ({ a, u: Array.from({ length: n }, gauss), v: Array.from({ length: n }, gauss) }));
    T = Array.from({ length: n }, (_, i) => Array.from({ length: n }, (_, j) => comps.reduce((acc, q) => acc + q.a * q.u[i] * q.v[j], 0) / 4 + 0.05 * gauss()));
    const AtA = new Float64Array(n * n); for (let p = 0; p < n; p++) for (let q = 0; q < n; q++) { let t = 0; for (let i = 0; i < n; i++) t += T[i][p] * T[i][q]; AtA[p * n + q] = t; }
    const E = jacobiEig(AtA, n); s = E.val.map(v => Math.sqrt(Math.max(0, v))); Vt = E.vec;
    U = Vt.map((v, k) => { const u = T.map(r => dotv(r, v)); return u.map(x => s[k] > 1e-9 ? x / s[k] : 0); });
  }
  seed = 21; gen();
  const m = reg({ el: c, draw() {
    const r = +ir.value, D = Math.pow(2, +id.value); $('#lora-r-o').textContent = r; $('#lora-d-o').textContent = D.toLocaleString('de-DE');
    const A = Array.from({ length: n }, (_, i) => Array.from({ length: n }, (_, j) => { let t = 0; for (let k = 0; k < r; k++) t += s[k] * U[k][i] * Vt[k][j]; return t; }));
    const Rm = T.map((row, i) => row.map((v, j) => v - A[i][j]));
    const amax = Math.max(...T.flat().map(Math.abs));
    const { ctx, w, h } = fit(c), narrow = w < 600;
    const cs = narrow ? Math.max(3, Math.floor((w - 40) / (3 * n))) : Math.max(3, Math.floor(Math.min((w * 0.72 - 60) / (3 * n), (h - 50) / n)));
    let x = 10; const y = 28;
    [['ΔW (Ziel)', T], [`BA mit Rang ${r}`, A], ['Rest ΔW − BA', Rm]].forEach(([t, M]) => { heatmap(ctx, M, { x, y, cell: cs, title: t, color: v => div(v / (amax * 0.6)) }); x += n * cs + 18; });
    // Singulärwerte
    const gx = narrow ? 10 : x + 6, gy = narrow ? y + n * cs + 30 : 10, gw = narrow ? w - 20 : w - gx - 6, gh = narrow ? h - gy - 4 : h - 14;
    const f = frame(ctx, gx, gy, gw, gh, { x0: 0, x1: 12.5, y0: 0, y1: s[0] * 1.08, xt: [1, 3, 6, 9, 12], yt: [0], yf: () => '0', xl: 'Singulärwerte σᵢ', l: 18, b: 32 });
    for (let k = 0; k < 12; k++) { const X = f.X(k + 1), Y = f.Y(s[k]); ctx.fillStyle = k < r ? tok('--accent') : rgba(tok('--muted'), 0.45); ctx.fillRect(X - 5, Y, 10, f.by + f.bh - Y); }
    const tot = s.reduce((a, v) => a + v * v, 0), kept = s.slice(0, r).reduce((a, v) => a + v * v, 0);
    const full = D * D, lora = r * 2 * D;
    $('#lora-read').innerHTML = `<span class="k">Erfasster Anteil von ‖ΔW‖²:</span> <b>${nf(100 * kept / tot, 1)} %</b>  <span class="k">·</span>  <span class="k">Parameter hier:</span> r·(d + k) = ${r * 2 * n} statt ${n * n}<br>` +
      `<span class="k">Bei d = k = ${D.toLocaleString('de-DE')}:</span> ${lora.toLocaleString('de-DE')} statt ${full.toLocaleString('de-DE')} Parameter, also <b>${nf(100 * lora / full, lora / full < 0.01 ? 2 : 1)} %</b>`;
  } });
  [ir, id].forEach(e => e.addEventListener('input', () => m.draw()));
  $('#lora-re').addEventListener('click', () => { seed = Math.floor(Math.random() * 1e6) + 1; gen(); m.draw(); });
})();
</script>
</body>
</html>
