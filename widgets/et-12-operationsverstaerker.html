<div class="ctrls">
<div class="ctrl" style="flex:0 1 190px"><div class="lab"><label for="op-c">Schaltung</label></div><select id="op-c"><option value="inv">Invertierender Verstärker</option><option value="non">Nichtinvertierender Verstärker</option><option value="fol">Spannungsfolger</option><option value="int">Integrator</option></select></div>

<div class="ctrl"><div class="lab"><label for="op-a">Amplitude U_e</label><output id="op-a-o"></output></div><input id="op-a" max="5" min="0.1" step="0.05" type="range" value="1"/></div>
</div>

<div class="ctrl" id="op-r1-w"><div class="lab"><label for="op-r1">R₁ / R</label><output id="op-r1-o"></output></div><input id="op-r1" max="2" min="0" step="0.01" type="range" value="1"/></div>
<div class="ctrl" id="op-r2-w"><div class="lab"><label for="op-r2">R₂</label><output id="op-r2-o"></output></div><input id="op-r2" max="2.3" min="0" step="0.01" type="range" value="1.5"/></div>
<div class="ctrl" hidden="" id="op-cc-w"><div class="lab"><label for="op-cc">C</label><output id="op-cc-o"></output></div><input id="op-cc" max="3" min="0" step="0.01" type="range" value="2"/></div>

</div>
<div class="readout" id="op-read"></div>
<figcaption><b>Abb. 12</b> Die vier Grundschaltungen mit idealem OPV an ±12 V Versorgung. Grau der Eingang, blau der Ausgang, gestrichelt die Versorgungsgrenzen. Dreh die Verstärkung hoch, bis der Ausgang an ±12 V abgeschnitten wird. Beim Integrator wird aus einem Rechteck ein Dreieck, aus einem Sinus ein um 90° verschobener Sinus mit Amplitude \(\hat U_e/(2\pi f RC)\). Der Gleichanteil des Integrators ist hier herausgerechnet, ein realer Integrator braucht dafür einen Widerstand parallel zu C, wie beim CSA.</figcaption>
</figure>

<script src="../assets/et.js"></script>
<script>
/* ---------- Abb. 10: Operationsverstärker ---------- */
(() => {
  const c = $('#cv-op'), iC = $('#op-c'), iW = $('#op-w'), iA = $('#op-a'), i1 = $('#op-r1'), i2 = $('#op-r2'), iCc = $('#op-cc'), iF = $('#op-f');
  const VS = 12;
  const m = reg({ el: c, draw() {
    const kind = iC.value, wave = iW.value, A = +iA.value, R1 = Math.pow(10, +i1.value) * 1e3, R2 = Math.pow(10, +i2.value) * 1e3, C = Math.pow(10, +iCc.value) * 1e-9, f = Math.pow(10, +iF.value);
    ['inv', 'non', 'fol', 'int'].forEach(k => $('#op-' + k).style.display = k === kind ? '' : 'none');
    $('#op-vm').style.display = (kind === 'inv' || kind === 'int') ? '' : 'none';
    $('#op-r1-w').hidden = kind === 'fol'; $('#op-r2-w').hidden = kind === 'fol' || kind === 'int'; $('#op-cc-w').hidden = kind !== 'int';
    $('#op-a-o').textContent = `${nf(A, 2)} V`; $('#op-r1-o').textContent = SI(R1, 'Ω'); $('#op-r2-o').textContent = SI(R2, 'Ω'); $('#op-cc-o').textContent = SI(C, 'F'); $('#op-f-o').textContent = SI(f, 'Hz');
    const N = 1200, T = 1 / f, tw = 3 * T, dt = tw / N, ue = new Float64Array(N), ua = new Float64Array(N);
    for (let k = 0; k < N; k++) { const ph = (k * dt) / T; ue[k] = wave === 'sin' ? A * Math.sin(2 * Math.PI * ph) : (ph % 1 < 0.5 ? A : -A); }
    let gain = 1, desc = '';
    if (kind === 'inv') { gain = -R2 / R1; for (let k = 0; k < N; k++) ua[k] = gain * ue[k]; desc = `U_a = −R₂/R₁ · U_e, Verstärkung ${nf(gain, 2)}`; }
    else if (kind === 'non') { gain = 1 + R2 / R1; for (let k = 0; k < N; k++) ua[k] = gain * ue[k]; desc = `U_a = (1 + R₂/R₁) · U_e, Verstärkung ${nf(gain, 2)}`; }
    else if (kind === 'fol') { for (let k = 0; k < N; k++) ua[k] = ue[k]; desc = 'U_a = U_e, Verstärkung 1'; }
    else { let s = 0; for (let k = 0; k < N; k++) { s += -ue[k] * dt / (R1 * C); ua[k] = s; } let mean = 0; const n0 = Math.floor(N / 3); for (let k = n0; k < N; k++) mean += ua[k]; mean /= (N - n0); for (let k = 0; k < N; k++) ua[k] -= mean;
      const g = 1 / (2 * Math.PI * f * R1 * C); desc = `U_a = −1/(RC) ∫U_e dt, für Sinus Verstärkung 1/(2πfRC) = ${nf(g, 2)}, τ = RC = ${SI(R1 * C, 's')}`; }
    let clip = false; for (let k = 0; k < N; k++) { if (Math.abs(ua[k]) > VS) { clip = true; ua[k] = Math.sign(ua[k]) * VS; } }
    let mx = 1; for (let k = 0; k < N; k++) mx = Math.max(mx, Math.abs(ue[k]), Math.abs(ua[k]));
    const ym = Math.min(14, mx * 1.2), tk = ticks(-ym, ym);
    const { ctx, w, h } = fit(c);
    const fr = frame(ctx, 0, 0, w, h, { x0: 0, x1: tw, y0: -ym, y1: ym, xt: [0, T, 2 * T, 3 * T], yt: tk.a, xf: v => v === 0 ? '0' : SI(v, 's', 1), yf: v => nf(v, tk.d), xl: 'Zeit', yl: 'Spannung (V)', l: 48 });
    clipBox(ctx, fr);
    if (ym >= VS) { ctx.strokeStyle = tok('--hole'); ctx.setLineDash([5, 4]); ctx.beginPath(); ctx.moveTo(fr.bx, fr.Y(VS)); ctx.lineTo(fr.bx + fr.bw, fr.Y(VS)); ctx.moveTo(fr.bx, fr.Y(-VS)); ctx.lineTo(fr.bx + fr.bw, fr.Y(-VS)); ctx.stroke(); ctx.setLineDash([]); }
    const line = (a, col, lw, dash) => { ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.setLineDash(dash || []); ctx.beginPath(); for (let k = 0; k < N; k++) { const x = fr.X(k * dt), y = fr.Y(a[k]); k ? ctx.lineTo(x, y) : ctx.moveTo(x, y); } ctx.stroke(); ctx.setLineDash([]); };
    line(ue, tok('--muted'), 1.6, [4, 3]); line(ua, tok('--accent'), 2.4);
    ctx.restore();
    ctx.font = `11px ${MONO}`; ctx.textAlign = 'right'; ctx.fillStyle = tok('--muted'); ctx.fillText('- - U_e   — U_a', fr.bx + fr.bw - 4, fr.by + 12);
    $('#op-read').innerHTML = `<span class="k">${desc}</span>` + (clip ? `<br><span style="color:var(--hole)">Ausgang begrenzt: Der OPV kann nicht über seine Versorgung von ±${VS} V hinaus.</span>` : '');
  }});
  [iC, iW, iA, i1, i2, iCc, iF].forEach(e => e.addEventListener('input', rafDebounce(() => m.draw()))); m.draw();
})();
</script>
