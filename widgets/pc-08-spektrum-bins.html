<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spektrum und Energie-Bins und Schwächungskoeffizienten</title>
<!-- Erzeugt von build.py aus src/figures/pc-08-spektrum-bins.html. Nicht von Hand bearbeiten. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@400;500&display=swap">
<script>
window.MathJax = {
  tex: { inlineMath: [['\\(', '\\)']], displayMath: [['\\[', '\\]'], ['$$', '$$']] },
  svg: { fontCache: 'global' },
  options: { skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'canvas', 'svg'] }
};
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.min.js" async></script>
<link rel="stylesheet" href="../assets/page.css">
<link rel="stylesheet" href="../assets/pc.css">
<script>try{var p=new URLSearchParams(location.search),t=p.get("theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);if(p.get("frame")==="0")document.documentElement.classList.add("noframe");}catch(e){}</script>
</head>
<body>
<main class="widget">
<figure class="fig">
<canvas aria-label="Röntgenspektrum vor und hinter dem Objekt, mit vier farbig markierten Energie-Bins." class="c-spec" id="cv-spec" role="img"></canvas>
<div class="ctrls">
<div class="ctrl"><div class="lab"><label for="sp-kv">Röhrenspannung</label><output id="sp-kv-o"></output></div><input id="sp-kv" max="140" min="80" step="10" type="range" value="120"/></div>
<div class="ctrl"><div class="lab"><label for="sp-w">Wasser</label><output id="sp-w-o"></output></div><input id="sp-w" max="40" min="0" step="1" type="range" value="20"/></div>
<div class="ctrl"><div class="lab"><label for="sp-i">Iod (Flächendichte)</label><output id="sp-i-o"></output></div><input id="sp-i" max="100" min="0" step="1" type="range" value="0"/></div>
</div>
<div class="ctrls">
<div class="ctrl"><div class="lab"><label for="sp-t0">T₁</label><output id="sp-t0-o"></output></div><input id="sp-t0" max="120" min="15" step="1" type="range" value="20"/></div>
<div class="ctrl"><div class="lab"><label for="sp-t1">T₂</label><output id="sp-t1-o"></output></div><input id="sp-t1" max="120" min="15" step="1" type="range" value="35"/></div>
<div class="ctrl"><div class="lab"><label for="sp-t2">T₃</label><output id="sp-t2-o"></output></div><input id="sp-t2" max="120" min="15" step="1" type="range" value="50"/></div>
<div class="ctrl"><div class="lab"><label for="sp-t3">T₄</label><output id="sp-t3-o"></output></div><input id="sp-t3" max="120" min="15" step="1" type="range" value="65"/></div>
</div>
<div class="tbl" style="margin:12px 0 0"><table class="small" id="sp-table"></table></div>
<figcaption><b>Abb. 8</b> Photonenspektrum (Kramers-Modell mit Wolfram-Linien, 6 mm Al Vorfilterung) vor dem Objekt (gestrichelt) und dahinter (gefüllt, beide auf ihr Maximum normiert). Iod wird als Flächendichte im Strahl angegeben: 10 mg/cm² entsprechen etwa einem 1 cm dicken Gefäß mit 10 mg/ml. Die Tabelle vergleicht, welchen Anteil jedes Bin an den gezählten Photonen hat und welchen Anteil es an der Energie, also dem Gewicht in einem integrierenden Detektor, hätte. Ideale Detektorantwort angenommen.</figcaption>
</figure>
<figure class="fig">
<canvas aria-label="Massenschwächungskoeffizienten von Wasser, kortikalem Knochen und Iod über der Energie mit K-Kante von Iod, logarithmische Achse." class="c-mu" id="cv-mu" role="img"></canvas>
<figcaption><b>Abb. 9</b> Massenschwächungskoeffizienten (Näherungswerte nach NIST-Tabellen) von Wasser, kortikalem Knochen und Iod. Die farbigen Bänder zeigen die Bins aus Abb. 8. Die K-Kante von Iod bei 33,2 keV ist der Sprung, den spektrale Bins sichtbar machen.</figcaption>
</figure>
</main>
<script src="../assets/ui.js"></script>
<script src="../assets/pc.js"></script>
<script>
/* ---------- Abb. 8 + 9: Spektrum, Bins, μ(E) ---------- */
(() => {
  const cs = $('#cv-spec'), cm = $('#cv-mu');
  const ikv = $('#sp-kv'), iw = $('#sp-w'), ii = $('#sp-i');
  const it = [0,1,2,3].map(k => $('#sp-t' + k));
  let T = [20,35,50,65], inc, tr;
  function thr(changed) {
    let v = it.map(e => +e.value);
    if (changed !== undefined) {
      for (let k = changed+1; k < 4; k++) if (v[k] < v[k-1] + 1) v[k] = v[k-1] + 1;
      for (let k = changed-1; k >= 0; k--) if (v[k] > v[k+1] - 1) v[k] = v[k+1] - 1;
      v = v.map(x => Math.min(120, Math.max(15, x)));
      v.forEach((x, k) => it[k].value = x);
    }
    T = v; T.forEach((x, k) => $('#sp-t' + k + '-o').textContent = `${x} keV`);
  }
  function update(changed) {
    thr(changed);
    const kv = +ikv.value;
    $('#sp-kv-o').textContent = `${kv} kV`; $('#sp-w-o').textContent = `${iw.value} cm`; $('#sp-i-o').textContent = `${ii.value} mg/cm²`;
    inc = tube(kv); tr = transmit(inc, +iw.value, +ii.value);
    // Tabelle
    let nT = 0, eT = 0; const n = [0,0,0,0], e = [0,0,0,0]; let below = 0;
    tr.forEach((v, i) => {
      const E = EG[i]; nT += v; eT += v*E;
      let b = -1; for (let k = 0; k < 4; k++) if (E >= T[k]) b = k;
      if (b < 0) below += v; else { n[b] += v; e[b] += v*E; }
    });
    const rows = [0,1,2,3].map(b => {
      const lo = T[b], hi = b < 3 ? T[b+1] : kv;
      return `<tr><td><span class="sw" style="background:var(${BINC[b]})"></span>Bin ${b+1}</td><td class="num">${lo}–${hi} keV</td><td class="num">${nf(n[b]/nT*100,1)} %</td><td class="num">${nf(e[b]/eT*100,1)} %</td><td class="num">${n[b] ? nf(e[b]/n[b],1) : '–'} keV</td></tr>`;
    }).join('');
    $('#sp-table').innerHTML = `<thead><tr><th>Bin</th><th class="num">Bereich</th><th class="num">Anteil Photonen</th><th class="num">Anteil Energie (EID)</th><th class="num">mittlere E</th></tr></thead><tbody>${rows}<tr><td class="muted">unter T₁</td><td class="num">&lt; ${T[0]} keV</td><td class="num">${nf(below/nT*100,1)} %</td><td class="num"></td><td class="num"></td></tr></tbody><tfoot><tr><td colspan="5" class="muted" style="font-size:12px;border:0">Mittlere Energie hinter dem Objekt: ${nf(eT/nT,1)} keV · Transmission: ${nf(nT/inc.reduce((a,b)=>a+b,0)*100, nT/inc.reduce((a,b)=>a+b,0) < 0.01 ? 2 : 1)} %</td></tr></tfoot>`;
    ms.draw(); mm.draw();
  }
  const ms = reg({ el: cs, draw() {
    if (!tr) return;
    const { ctx, w, h } = fit(cs);
    const kv = +ikv.value;
    const f = frame(ctx, w, h, { x0: 10, x1: 150, y0: 0, y1: 1.08, xt: [20, 40, 60, 80, 100, 120, 140], yt: [0, 0.5, 1], yf: v => nf(v,1), xl: 'Energie (keV)', yl: 'Photonen (norm.)', l: 46 });
    const mi = Math.max(...inc), mt = Math.max(...tr) || 1;
    clipBox(ctx, f);
    for (let i = 0; i < EG.length - 1; i++) {
      const E = EG[i]; let b = -1; for (let k = 0; k < 4; k++) if (E >= T[k]) b = k;
      const v = tr[i]/mt;
      ctx.fillStyle = b < 0 ? rgba(tok('--muted'), 0.35) : rgba(tok(BINC[b]), 0.75);
      ctx.fillRect(f.X(E), f.Y(v), f.X(EG[i+1]) - f.X(E) + 0.5, f.Y(0) - f.Y(v));
    }
    ctx.strokeStyle = tok('--fg'); ctx.lineWidth = 1.4; ctx.beginPath(); tr.forEach((v, i) => { const x = f.X(EG[i]), y = f.Y(v/mt); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); ctx.stroke();
    ctx.strokeStyle = tok('--muted'); ctx.setLineDash([4,4]); ctx.lineWidth = 1.3; ctx.beginPath(); inc.forEach((v, i) => { const x = f.X(EG[i]), y = f.Y(v/mi); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); ctx.stroke(); ctx.setLineDash([]);
    T.forEach((t, k) => { ctx.strokeStyle = tok(BINC[k]); ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(f.X(t), f.by); ctx.lineTo(f.X(t), f.by+f.bh); ctx.stroke(); });
    if (+ii.value > 0) { ctx.strokeStyle = tok('--fg'); ctx.setLineDash([2,3]); ctx.beginPath(); ctx.moveTo(f.X(33.17), f.by); ctx.lineTo(f.X(33.17), f.by+f.bh); ctx.stroke(); ctx.setLineDash([]); }
    ctx.restore();
    ctx.font = `11px ${MONO}`; ctx.fillStyle = tok('--muted'); ctx.textAlign = 'right';
    ctx.fillText(`- - vor Objekt   ▇ hinter Objekt`, f.bx + f.bw - 4, f.by + 12);
    if (+ii.value > 0) { ctx.textAlign = 'left'; ctx.fillStyle = tok('--fg'); ctx.fillText('I K-Kante', f.X(33.17) + 4, f.by + 28); }
    T.forEach((t, k) => { ctx.fillStyle = tok(BINC[k]); ctx.textAlign = 'left'; ctx.fillText(`T${k+1}`, f.X(t) + 3, f.by + f.bh - 6 - (k % 2)*12); });
  }});
  const mm = reg({ el: cm, draw() {
    const { ctx, w, h } = fit(cm);
    const f = frame(ctx, w, h, { x0: 10, x1: 150, y0: 0.1, y1: 200, ylog: true, xt: [20, 40, 60, 80, 100, 120, 140], yt: [0.1, 1, 10, 100], yf: v => v < 1 ? '0,1' : String(v), xl: 'Energie (keV)', yl: 'μ/ρ (cm²/g)', l: 46, r: 64 });
    const kv = +ikv.value;
    clipBox(ctx, f);
    for (let k = 0; k < 4; k++) { const a = T[k], b = k < 3 ? T[k+1] : kv; ctx.fillStyle = rgba(tok(BINC[k]), 0.12); ctx.fillRect(f.X(a), f.by, f.X(b) - f.X(a), f.bh); }
    const curve = (fn, col) => { ctx.strokeStyle = col; ctx.lineWidth = 2.2; ctx.beginPath(); let first = true, prevE = 0; for (let E = 10; E <= 150; E += 0.25) { const x = f.X(E), y = f.Y(fn(E)); if (first) { ctx.moveTo(x, y); first = false; } else ctx.lineTo(x, y); prevE = E; } ctx.stroke(); };
    curve(E => mu(WATER, E), tok('--elec'));
    curve(E => mu(BONE, E), tok('--muted'));
    curve(muI, tok('--hole'));
    ctx.restore();
    ctx.font = `12px ${DISP}`; ctx.textAlign = 'left';
    [['Iod', muI(150), '--hole'], ['Knochen', mu(BONE, 150)*1.35, '--muted'], ['Wasser', mu(WATER, 150)*0.72, '--elec']].forEach(([t, v, cc]) => { ctx.fillStyle = tok(cc); ctx.fillText(t, f.bx + f.bw + 6, f.Y(v) + 4); });
    ctx.fillStyle = tok('--fg'); ctx.font = `11px ${MONO}`; ctx.fillText('K-Kante 33,2 keV', f.X(33.17) + 6, f.Y(36) - 4);
  }});
  [ikv, iw, ii].forEach(el => el.addEventListener('input', () => update()));
  it.forEach((el, k) => el.addEventListener('input', () => update(k)));
  update();
})();
</script>
</body>
</html>
