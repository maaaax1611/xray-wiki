<!-- title: Elektromagnetische Welle
     lib: et -->
<figure class="fig">
<canvas aria-label="Animation einer elektromagnetischen Welle: das elektrische Feld schwingt vertikal, das magnetische senkrecht dazu, beide breiten sich nach rechts aus." class="c-emw" id="cv-em" role="img"></canvas>
<div class="ctrls">
<div class="ctrl"><div class="lab"><label for="em-l">Wellenlänge (Darstellung)</label><output id="em-l-o"></output></div><input id="em-l" max="3" min="0.5" step="0.05" type="range" value="1.4"/></div>
<button class="btn" id="em-play" type="button">Pause</button>
</div>
<figcaption><b>Abb. 5</b> Elektromagnetische Welle. Das E-Feld (rot) schwingt in der Bildebene auf und ab, das B-Feld (blau) senkrecht dazu, perspektivisch schräg gezeichnet. Beide laufen gemeinsam mit Lichtgeschwindigkeit nach rechts.</figcaption>
</figure>
<script>
/* ---------- Abb. 6: EM-Welle ---------- */
(() => {
  const c = $('#cv-em'), il = $('#em-l'); let ph = 0;
  const m = reg({ el: c, anim: true, playing: !reduceMotion,
    step(dt) { ph += dt * 2.2; },
    draw() {
      const { ctx, w, h } = fit(c); const L = +il.value; $('#em-l-o').textContent = nf(L, 2);
      const x0 = 30, x1 = w - 40, cy = h * 0.55, A = h * 0.3, k = 2 * Math.PI / (L * (x1 - x0) / 3);
      const proj = (x, ey, bz) => [x - bz * 0.55, cy - ey + bz * 0.38];
      ctx.strokeStyle = tok('--muted'); ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(x0, cy); ctx.lineTo(x1, cy); ctx.stroke();
      ctx.fillStyle = tok('--muted'); ctx.beginPath(); ctx.moveTo(x1 + 12, cy); ctx.lineTo(x1, cy - 5); ctx.lineTo(x1, cy + 5); ctx.fill();
      for (let x = x0; x <= x1; x += 10) {
        const s = Math.sin(k * (x - x0) - ph);
        ctx.strokeStyle = rgba(tok('--elec'), 0.5); ctx.beginPath(); ctx.moveTo(...proj(x, 0, 0)); ctx.lineTo(...proj(x, 0, A * 0.75 * s)); ctx.stroke();
        ctx.strokeStyle = rgba(tok('--hole'), 0.55); ctx.beginPath(); ctx.moveTo(...proj(x, 0, 0)); ctx.lineTo(...proj(x, A * s, 0)); ctx.stroke();
      }
      const curve = (fn, col) => { ctx.strokeStyle = col; ctx.lineWidth = 2.2; ctx.beginPath(); for (let x = x0; x <= x1; x += 2) { const p = fn(x, Math.sin(k * (x - x0) - ph)); x === x0 ? ctx.moveTo(...p) : ctx.lineTo(...p); } ctx.stroke(); ctx.lineWidth = 1; };
      curve((x, s) => proj(x, 0, A * 0.75 * s), tok('--elec'));
      curve((x, s) => proj(x, A * s, 0), tok('--hole'));
      ctx.font = `600 14px ${DISP}`; ctx.textAlign = 'left';
      ctx.fillStyle = tok('--hole'); ctx.fillText('E', x0 + 6, cy - A - 6);
      ctx.fillStyle = tok('--elec'); ctx.fillText('B', x0 - 12, cy + A * 0.75 * 0.38 + 16);
      ctx.fillStyle = tok('--muted'); ctx.font = `12px ${DISP}`; ctx.textAlign = 'right'; ctx.fillText('Ausbreitung mit c →', x1, h - 8);
    }
  });
  il.addEventListener('input', () => m.draw()); playBtn($('#em-play'), m); m.draw();
})();
</script>
