<!-- title: Polare Abtastung und Rampenfilter
     lib: rk -->
<figure class="fig">
<canvas aria-label="Links: radiale Abtastung des Frequenzraums durch Projektionen, dicht im Zentrum und dünn außen. Rechts: Abtastdichte proportional zu 1 durch Betrag omega und der Rampenfilter, der sie ausgleicht." class="c-polar" id="cv-polar" role="img"></canvas>
<figcaption><b>Abb. 5</b> Links: Wo die Projektionen von 16 Winkeln das Spektrum abtasten. Der Kreis innen enthält genauso viele Punkte wie der Ring außen, obwohl seine Fläche viel kleiner ist. Rechts: Die Abtastdichte fällt wie \(1/|\omega|\) (gestrichelt), der Rampenfilter \(|\omega|\) gleicht das aus. Ihr Produkt ist konstant.</figcaption>
</figure>
<script>
/* ---------- Abb. 5: Polare Abtastung ---------- */
(() => {
  const c = $('#cv-polar');
  reg({ el: c, draw() {
    const { ctx, w, h } = fit(c);
    const narrow = w < 560; const s = narrow ? Math.min(w, h * 0.52) : Math.min(h, w * 0.45);
    const cx = narrow ? w / 2 : s / 2, cy = narrow ? s / 2 : h / 2, R = s / 2 - 10;
    ctx.strokeStyle = tok('--rule'); ctx.beginPath(); ctx.arc(cx, cy, R, 0, 7); ctx.stroke();
    ctx.fillStyle = rgba(tok('--accent'), 0.12); ctx.beginPath(); ctx.arc(cx, cy, R * 0.3, 0, 7); ctx.fill();
    ctx.strokeStyle = rgba(tok('--bin2'), 0.8); ctx.lineWidth = 1.2; ctx.beginPath(); ctx.arc(cx, cy, R * 0.85, 0, 7); ctx.arc(cx, cy, R * 0.95, 0, 7, true); ctx.stroke(); ctx.lineWidth = 1;
    const NA = 16, NP = 12;
    for (let a = 0; a < NA; a++) { const t = a * Math.PI / NA; ctx.strokeStyle = rgba(tok('--muted'), 0.35); ctx.beginPath(); ctx.moveTo(cx - R * Math.cos(t), cy + R * Math.sin(t)); ctx.lineTo(cx + R * Math.cos(t), cy - R * Math.sin(t)); ctx.stroke();
      for (let k = -NP; k <= NP; k++) { const rr = k / NP * R; ctx.fillStyle = tok('--accent'); ctx.beginPath(); ctx.arc(cx + rr * Math.cos(t), cy - rr * Math.sin(t), 2, 0, 7); ctx.fill(); } }
    ctx.font = `11px ${MONO}`; ctx.fillStyle = tok('--muted'); ctx.textAlign = 'left'; ctx.fillText('u', cx + R - 6, cy + 14); ctx.fillText('v', cx + 6, cy - R + 10);
    const B = narrow ? [0, s + 6, w, h - s - 6] : [s + 16, 0, w - s - 16, h];
    const f = frame(ctx, B[0], B[1], B[2], B[3], { x0: 0, x1: 1, y0: 0, y1: 1.6, xt: [0, 0.25, 0.5, 0.75, 1], yt: [0, 0.5, 1, 1.5], xf: v => nf(v, 2), yf: v => nf(v, 1), xl: '|ω| / ω_Nyquist', l: 36 });
    clipBox(ctx, f);
    ctx.strokeStyle = tok('--muted'); ctx.setLineDash([5, 4]); ctx.lineWidth = 1.5; ctx.beginPath(); for (let x = 0.08; x <= 1; x += 0.01) { const y = 0.1 / x; x === 0.08 ? ctx.moveTo(f.X(x), f.Y(y)) : ctx.lineTo(f.X(x), f.Y(y)); } ctx.stroke(); ctx.setLineDash([]);
    ctx.strokeStyle = tok('--accent'); ctx.lineWidth = 2.2; ctx.beginPath(); ctx.moveTo(f.X(0), f.Y(0)); ctx.lineTo(f.X(1), f.Y(1)); ctx.stroke();
    ctx.strokeStyle = tok('--fg'); ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(f.X(0.05), f.Y(0.1)); ctx.lineTo(f.X(1), f.Y(0.1)); ctx.stroke();
    ctx.restore();
    ctx.font = `11px ${MONO}`; ctx.textAlign = 'left';
    ctx.fillStyle = tok('--muted'); ctx.fillText('- - Abtastdichte ∝ 1/|ω|', f.bx + 30, f.by + 14);
    ctx.fillStyle = tok('--accent'); ctx.fillText('— Rampenfilter |ω|', f.bx + 30, f.by + 28);
    ctx.fillStyle = tok('--fg'); ctx.fillText('— Produkt: konstant', f.bx + 30, f.by + 42);
  }}).draw();
})();
</script>
