<!-- title: Gewichtungspotential und Small-Pixel-Effekt
     lib: pc -->
<figure class="fig">
<div class="two">
<canvas aria-label="Berechnetes Gewichtungspotential eines Pixels im Querschnitt durch den Sensor." class="c-wp" id="cv-wp" role="img"></canvas>
<canvas aria-label="Gewichtungspotential auf der Pixelachse und induzierte Ladung über der Zeit, verglichen mit einem planaren Detektor." class="c-q" id="cv-q" role="img"></canvas>
</div>
<div class="ctrls">
<div class="ctrl"><div class="lab"><label for="wp-p">Pixelbreite / Dicke</label><output id="wp-p-o"></output></div><input id="wp-p" max="1.5" min="0.06" step="0.01" type="range" value="0.14"/></div>
<div class="ctrl"><div class="lab"><label for="wp-x">Interaktionstiefe (ab Kathode)</label><output id="wp-x-o"></output></div><input id="wp-x" max="0.98" min="0.02" step="0.01" type="range" value="0.5"/></div>
<div class="ctrl"><div class="lab"><label for="wp-mt">μτ der Löcher</label><output id="wp-mt-o"></output></div><input id="wp-mt" max="-3" min="-6" step="0.05" type="range" value="-4.5"/></div>
</div>
<div class="readout" id="wp-read"></div>
<figcaption><b>Abb. 3</b> Links: numerisch gelöstes Gewichtungspotential des mittleren Pixels (2D-Schnitt, Höhenlinien in Zehntelstufen). Der Punkt markiert die Interaktion, blau driften die Elektronen zur Anode, rot die Löcher zur Kathode. Rechts oben: \(\varphi_w\) auf der Pixelachse, rechts unten: induzierte Ladung über der Zeit. Gestrichelt ist jeweils der planare Fall. Annahmen: d = 1,6 mm, 1000 V, μₑ = 1100 cm²/Vs, μₕ = 100 cm²/Vs, (μτ)ₑ = 3·10⁻³ cm²/V.</figcaption>
</figure>
<script>
/* ---------- Abb. 3: Gewichtungspotential ---------- */
(() => {
  const cw = $('#cv-wp'), cq = $('#cv-q');
  const ip = $('#wp-p'), ix = $('#wp-x'), imt = $('#wp-mt');
  let sol = null, solP = -1;
  function solve(p) {
    const NZ = 50, W = Math.max(6*p, 4.2), NX = 168;
    const dx = W/NX, dz = 1/NZ, ax = 1/(dx*dx), az = 1/(dz*dz), den = 2*ax + 2*az;
    const N1 = NX+1, phi = new Float64Array(N1*(NZ+1));
    const onPix = i => Math.abs(-W/2 + i*dx) <= p/2 + 1e-9;
    for (let j = 0; j <= NZ; j++) for (let i = 0; i <= NX; i++) phi[j*N1+i] = onPix(i) ? Math.max(0, 1 - j/NZ*(1+0.5/p)) : 0;
    for (let i = 0; i <= NX; i++) { phi[i] = onPix(i) ? 1 : 0; phi[NZ*N1+i] = 0; }
    const w = 1.9;
    for (let it = 0; it < 1400; it++) {
      for (let j = 1; j < NZ; j++) {
        const r = j*N1;
        phi[r] = phi[r+1]; phi[r+NX] = phi[r+NX-1];
        for (let i = 1; i < NX; i++) {
          const k = r+i;
          const g = (ax*(phi[k-1]+phi[k+1]) + az*(phi[k-N1]+phi[k+N1])) / den;
          phi[k] += w*(g - phi[k]);
        }
      }
    }
    const ic = NX/2, axis = new Float64Array(NZ+1);
    for (let j = 0; j <= NZ; j++) axis[j] = phi[j*N1+ic];
    return { phi, NX, NZ, W, dx, N1, axis };
  }
  const phiAx = (u, ax) => { const n = ax.length-1; const t = Math.min(n, Math.max(0, u*n)); const j = Math.min(n-1, Math.floor(t)); const f = t - j; return ax[j]*(1-f) + ax[j+1]*f; };
  function induced(ax, planar, u0, mth) {
    const ve = 0.04297, vh = 0.003906, te = 2727, th = (Math.pow(10, mth)/100)*1e9;
    const P = planar ? (u => 1 - u) : (u => phiAx(u, ax));
    const dt = 0.25, T = 320, out = [];
    let ue = u0, uh = u0, Q = 0;
    for (let t = 0; t <= T; t += dt) {
      out.push([t, Q]);
      const ne = Math.exp(-t/te), nh = Math.exp(-t/th);
      if (ue > 0) { const un = Math.max(0, ue - ve*dt); Q += ne*(P(un) - P(ue)); ue = un; }
      if (uh < 1) { const un = Math.min(1, uh + vh*dt); Q -= nh*(P(un) - P(uh)); uh = un; }
    }
    return out;
  }
  let qs = null, qp = null;
  function update() {
    const p = +ip.value, x = +ix.value, mth = +imt.value;
    $('#wp-p-o').textContent = `${nf(p,2)} (${nf(p*1600,0)} µm)`;
    $('#wp-x-o').textContent = `${nf(x*1.6,2)} mm`;
    $('#wp-mt-o').textContent = `${nf(Math.pow(10, mth)/Math.pow(10, Math.floor(mth)),1)}·10${String(Math.floor(mth)).split('').map(c=>SUP[c]).join('')} cm²/V`;
    if (Math.abs(p - solP) > 1e-6) { sol = solve(p); solP = p; }
    const u0 = 1 - x;
    qs = induced(sol.axis, false, u0, mth); qp = induced(null, true, u0, mth);
    const cs = qs[qs.length-1][1], cp = qp[qp.length-1][1];
    $('#wp-read').innerHTML = `<span class="k">Gesammelte Ladung (CCE):</span> Pixel ${nf(cs*100,1)} %  <span class="k">·</span>  planar ${nf(cp*100,1)} %  <span class="k">·</span>  <span class="k">φ_w in Interaktionstiefe:</span> ${nf(phiAx(u0, sol.axis),2)}`;
    m1.draw(); m2.draw();
  }
  const m1 = reg({ el: cw, draw() {
    if (!sol) return;
    const { ctx, w, h } = fit(cw);
    const fg = tok('--fg'), mut = tok('--muted'), bg = rgb(tok('--surface')), ac = rgb(tok('--accent'));
    const top = 18, bot = 18, H = h - top - bot, Wd = w;
    const res = 2, iw = Math.ceil(Wd/res), ih = Math.ceil(H/res);
    const img = ctx.createImageData(iw, ih);
    const { phi, NX, NZ, W, N1 } = sol;
    for (let yy = 0; yy < ih; yy++) {
      const u = 1 - yy/(ih-1);
      const jf = u*NZ, j = Math.min(NZ-1, Math.floor(jf)), fz = jf - j;
      for (let xx = 0; xx < iw; xx++) {
        const xd = -1 + 2*xx/(iw-1);
        const fi = (xd + W/2)/W*NX, i = Math.min(NX-1, Math.max(0, Math.floor(fi))), fx = fi - i;
        const v = (phi[j*N1+i]*(1-fx) + phi[j*N1+i+1]*fx)*(1-fz) + (phi[(j+1)*N1+i]*(1-fx) + phi[(j+1)*N1+i+1]*fx)*fz;
        const lv = Math.min(1, Math.max(0, v));
        const q = Math.floor(lv*10)/10 + 0.05;
        const a = Math.pow(q, 0.7)*0.95;
        const o = (yy*iw + xx)*4;
        img.data[o] = bg[0] + (ac[0]-bg[0])*a; img.data[o+1] = bg[1] + (ac[1]-bg[1])*a; img.data[o+2] = bg[2] + (ac[2]-bg[2])*a; img.data[o+3] = 255;
      }
    }
    const off = document.createElement('canvas'); off.width = iw; off.height = ih; off.getContext('2d').putImageData(img, 0, 0);
    ctx.imageSmoothingEnabled = true; ctx.drawImage(off, 0, top, Wd, H);
    // Elektroden
    const p = solP, X = xd => (xd + 1)/2*Wd;
    ctx.fillStyle = fg; ctx.fillRect(0, top-3, Wd, 3);
    ctx.font = `11px ${MONO}`; ctx.textAlign = 'left'; ctx.fillStyle = mut; ctx.fillText('Kathode', 4, top-6);
    for (let k = -8; k <= 8; k++) {
      const c0 = k*p; const a = X(c0 - p/2 + Math.min(0.03, p*0.1)), b = X(c0 + p/2 - Math.min(0.03, p*0.1));
      if (b < 0 || a > Wd) continue;
      ctx.fillStyle = k === 0 ? tok('--accent') : rgba(fg, 0.55);
      ctx.fillRect(a, top + H, Math.max(1, b - a), 4);
    }
    ctx.fillStyle = mut; ctx.fillText('Pixelanoden', 4, top + H + 15);
    // Interaktion
    const x = +ix.value, py = top + x*H, pxx = X(0);
    ctx.strokeStyle = tok('--elec'); ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(pxx, py+5); ctx.lineTo(pxx, top+H-6); ctx.stroke();
    ctx.fillStyle = tok('--elec'); ctx.beginPath(); ctx.moveTo(pxx-5, top+H-10); ctx.lineTo(pxx+5, top+H-10); ctx.lineTo(pxx, top+H-2); ctx.fill();
    ctx.strokeStyle = tok('--hole'); ctx.beginPath(); ctx.moveTo(pxx+9, py-5); ctx.lineTo(pxx+9, top+6); ctx.stroke();
    ctx.fillStyle = tok('--hole'); ctx.beginPath(); ctx.moveTo(pxx+4, top+10); ctx.lineTo(pxx+14, top+10); ctx.lineTo(pxx+9, top+2); ctx.fill();
    ctx.fillStyle = fg; ctx.beginPath(); ctx.arc(pxx, py, 5, 0, 7); ctx.fill();
    ctx.strokeStyle = tok('--surface'); ctx.lineWidth = 1.5; ctx.stroke();
    ctx.textAlign = 'right'; ctx.fillStyle = fg; ctx.font = `11px ${MONO}`; ctx.fillText('φ_w: 0 … 1', Wd - 4, top - 6);
  }});
  const m2 = reg({ el: cq, draw() {
    if (!sol || !qs) return;
    const { ctx, w, h } = fit(cq);
    const h1 = Math.round(h*0.44);
    const acc = tok('--accent'), mut = tok('--muted'), fg = tok('--fg');
    // phi(u)
    let f = frame(ctx, w, h1, { x0: 0, x1: 1, y0: 0, y1: 1, xt: [0, 0.5, 1], yt: [0, 0.5, 1], xf: v => v === 0 ? 'Anode' : v === 1 ? 'Kathode' : '', yf: v => nf(v,1), b: 22, t: 10, yl: 'φ_w', l: 46 });
    clipBox(ctx, f);
    ctx.strokeStyle = mut; ctx.setLineDash([4,4]); ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(f.X(0), f.Y(1)); ctx.lineTo(f.X(1), f.Y(0)); ctx.stroke(); ctx.setLineDash([]);
    ctx.strokeStyle = acc; ctx.lineWidth = 2.2; ctx.beginPath();
    sol.axis.forEach((v, j) => { const u = j/(sol.axis.length-1); j ? ctx.lineTo(f.X(u), f.Y(v)) : ctx.moveTo(f.X(u), f.Y(v)); }); ctx.stroke();
    const u0 = 1 - (+ix.value); ctx.strokeStyle = fg; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(f.X(u0), f.by); ctx.lineTo(f.X(u0), f.by+f.bh); ctx.stroke();
    ctx.restore();
    // Q(t)
    ctx.save(); ctx.translate(0, h1 + 6);
    f = frame(ctx, w, h - h1 - 6, { x0: 0, x1: 320, y0: 0, y1: 1.05, xt: [0, 100, 200, 300], yt: [0, 0.5, 1], yf: v => nf(v*100,0) + '%', xl: 'Zeit (ns)', yl: 'Q_ind / Q₀', l: 46, t: 8 });
    clipBox(ctx, f);
    const line = (arr, col, dash, lw) => { ctx.strokeStyle = col; ctx.setLineDash(dash); ctx.lineWidth = lw; ctx.beginPath(); arr.forEach(([t, q], i) => i ? ctx.lineTo(f.X(t), f.Y(q)) : ctx.moveTo(f.X(t), f.Y(q))); ctx.stroke(); ctx.setLineDash([]); };
    line(qp, mut, [4,4], 1.5); line(qs, acc, [], 2.2);
    ctx.restore(); ctx.restore();
    ctx.fillStyle = mut; ctx.font = `11px ${MONO}`; ctx.textAlign = 'right';
    ctx.fillText('— Pixel   - - planar', w - 16, 12);
  }});
  [ip, ix, imt].forEach(el => el.addEventListener('input', update));
  update();
})();
</script>
