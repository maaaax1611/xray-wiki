<!-- title: Bändermodell
     lib: gl -->
<figure class="fig">
<div class="svgbox">
<svg aria-label="Bändermodell für Metall, Halbleiter und Isolator. Beim Metall überlappen die Bänder, beim Halbleiter gibt es eine kleine Lücke von etwa 1 eV, beim Isolator eine große Lücke von über 5 eV." role="img" viewbox="0 0 760 290">
<g font-size="13">
<text class="d-fg" font-size="15" font-weight="600" text-anchor="middle" x="120" y="24">Metall (Leiter)</text>
<rect class="d-surf" height="70" rx="3" style="stroke:var(--fg)" width="120" x="60" y="50"></rect>
<rect class="d-soft" height="110" rx="3" style="stroke:var(--fg)" width="120" x="60" y="100"></rect>
<g class="d-e"><circle cx="80" cy="110" r="4"></circle><circle cx="105" cy="95" r="4"></circle><circle cx="130" cy="108" r="4"></circle><circle cx="155" cy="90" r="4"></circle><circle cx="168" cy="112" r="4"></circle></g>
<text class="d-mut" font-size="12" text-anchor="middle" x="120" y="236">Bänder überlappen:</text>
<text class="d-mut" font-size="12" text-anchor="middle" x="120" y="252">immer freie Elektronen</text>
<text class="d-fg" font-size="15" font-weight="600" text-anchor="middle" x="380" y="24">Halbleiter</text>
<rect class="d-surf" height="60" rx="3" style="stroke:var(--fg)" width="120" x="320" y="50"></rect>
<text class="d-fg" font-size="12" text-anchor="middle" x="380" y="70">Leitungsband</text>
<rect class="d-soft" height="60" rx="3" style="stroke:var(--fg)" width="120" x="320" y="150"></rect>
<text class="d-fg" font-size="12" text-anchor="middle" x="380" y="190">Valenzband</text>
<line class="d-st" stroke-width="1.2" x1="452" x2="452" y1="110" y2="150"></line><line class="d-st" x1="447" x2="457" y1="110" y2="110"></line><line class="d-st" x1="447" x2="457" y1="150" y2="150"></line>
<text class="d-fg m" font-size="11" x="462" y="126">E_g ≈ 1–1,5 eV</text>
<text class="d-mut" font-size="12" x="462" y="142">(CdTe: 1,44 eV)</text>
<circle class="d-e" cx="350" cy="92" r="4"></circle><circle class="d-surf" cx="350" cy="162" r="4" stroke-width="1.5" style="stroke:var(--hole)"></circle>
<line class="d-ste" stroke-dasharray="3 3" stroke-width="1.3" x1="350" x2="350" y1="156" y2="100"></line>
<text class="d-mut" font-size="12" text-anchor="middle" x="380" y="236">wenig freie Ladung, aber</text>
<text class="d-mut" font-size="12" text-anchor="middle" x="380" y="252">Energie von außen setzt welche frei</text>
<text class="d-fg" font-size="15" font-weight="600" text-anchor="middle" x="640" y="24">Isolator</text>
<rect class="d-surf" height="45" rx="3" style="stroke:var(--fg)" width="120" x="580" y="50"></rect>
<rect class="d-soft" height="45" rx="3" style="stroke:var(--fg)" width="120" x="580" y="165"></rect>
<line class="d-st" stroke-width="1.2" x1="712" x2="712" y1="95" y2="165"></line><line class="d-st" x1="707" x2="717" y1="95" y2="95"></line><line class="d-st" x1="707" x2="717" y1="165" y2="165"></line>
<text class="d-fg m" font-size="11" text-anchor="middle" x="640" y="135">E_g &gt; 5 eV</text>
<text class="d-mut" font-size="12" text-anchor="middle" x="640" y="236">große Lücke:</text>
<text class="d-mut" font-size="12" text-anchor="middle" x="640" y="252">praktisch keine freien Elektronen</text>
</g>
<text class="d-mut m" font-size="11" x="22" y="278">↑ Elektronenenergie</text>
</svg>
</div>
<figcaption><b>Abb. 5</b> Bändermodell. Im Halbleiter (Mitte) hebt Energie ein Elektron (blau) ins Leitungsband. Zurück bleibt eine Lücke im Valenzband, das <strong>Loch</strong> (rot umrandet). Ein Loch verhält sich wie ein positiv geladenes Teilchen und kann ebenfalls wandern.</figcaption>
</figure>
