<figure class="fig">

<g font-size="14">
<rect class="d-soft" height="70" style="stroke:var(--fg)" width="70" x="80" y="40"></rect><rect class="d-soft" height="70" style="stroke:var(--fg)" width="70" x="150" y="40"></rect>
<rect class="d-soft" height="70" style="stroke:var(--fg)" width="70" x="80" y="110"></rect><rect class="d-soft" height="70" style="stroke:var(--fg)" width="70" x="150" y="110"></rect>
<g class="d-fg m" font-size="16" text-anchor="middle"><text x="115" y="80">x₁</text><text x="185" y="80">x₂</text><text x="115" y="150">x₃</text><text x="185" y="150">x₄</text></g>

<g class="d-fg m" font-size="13"><text x="256" y="79">= 3</text><text x="256" y="149">= 7</text><text font-size="12" x="104" y="210">4</text><text font-size="12" x="176" y="210">6</text><text font-size="12" x="244" y="200">5</text></g>
