<figcaption><b>Abb. 7</b> Dotierung im Siliziumgitter, vereinfacht in 2D. Jedes Siliziumatom ist mit vier Nachbarn verbunden. Ein Phosphoratom bringt ein fünftes Elektron mit, das keinen Bindungspartner findet und sich frei bewegen kann. Einem Boratom fehlt ein Elektron für die vierte Bindung. Die Lücke, das Loch, kann von Nachbarelektronen gefüllt werden und wandert dadurch wie eine positive Ladung.</figcaption>
