<figcaption><b>Abb. 4</b> Signalkette eines Pixelkanals. Der ladungsempfindliche Verstärker (CSA) wandelt die influenzierte Ladung in eine Spannungsstufe um, der Pulsformer macht daraus einen kurzen Puls, dessen Höhe proportional zur Energie ist. Jeder Komparator inkrementiert seinen Zähler, wenn der Puls seine Schwelle überschreitet. Die Zähler messen also integrale Spektren \(N(E \ge T_k)\), die Bins ergeben sich als Differenzen.</figcaption>
</figure>
