<!-- title: pn-Übergang
     lib: et -->
<figure class="fig">
<canvas aria-label="pn-Übergang: links p-Gebiet mit Löchern, rechts n-Gebiet mit Elektronen, dazwischen die Raumladungszone mit ortsfesten Ionen. Darunter das elektrische Feld über dem Ort." class="c-pn" id="cv-pn" role="img"></canvas>
<div class="ctrls">
<div class="ctrl"><div class="lab"><label for="pn-u">Angelegte Spannung U</label><output id="pn-u-o"></output></div><input id="pn-u" max="0.6" min="-50" step="0.05" type="range" value="0"/></div>
<div class="ctrl"><div class="lab"><label for="pn-n">Dotierung (beide Seiten)</label><output id="pn-n-o"></output></div><input id="pn-n" max="17" min="13" step="0.05" type="range" value="15"/></div>
</div>
<div class="readout" id="pn-read"></div>
<figcaption><b>Abb. 8</b> pn-Übergang in Silizium, beide Seiten gleich stark dotiert. Oben: Löcher (rot, links) und Elektronen (blau, rechts) sind frei beweglich. In der Raumladungszone in der Mitte gibt es keine freien Ladungsträger mehr, dort bleiben nur die ortsfesten Ionen der Dotieratome zurück (− links, + rechts). Unten das elektrische Feld, das diese Ionen erzeugen. Eine negative Spannung (Sperrrichtung) verbreitert die Zone, eine positive (Durchlassrichtung) baut sie ab. Schwächere Dotierung ergibt eine breitere Zone.</figcaption>
</figure>
<script>
/* ---------- pn-Übergang ---------- */
(() => {
  const c = $('#cv-pn'), iU = $('#pn-u'), iN = $('#pn-n');
  const EPS = 11.7 * 8.854e-14, QE = 1.602e-19, NI = 1e10, UTH = 0.02585;
  const rnd = []; for (let k = 0; k < 600; k++) rnd.push([Math.random(), Math.random()]);
  const m = reg({ el: c, draw() {
    const U = +iU.value, N = Math.pow(10, +iN.value), UD = UTH * Math.log(N * N / (NI * NI));
    const wcm = Math.sqrt(2 * EPS / QE * (2 / N) * Math.max(0.02, UD - U)), w = wcm * 1e4; // µm
    const wmax = Math.sqrt(2 * EPS / QE * (2 / N) * (UD + 50)) * 1e4, span = wmax * 2.4;
    const Em = QE * N * (wcm / 2) / EPS; // V/cm
    $('#pn-u-o').textContent = `${nf(U, 2)} V`; $('#pn-n-o').textContent = `10^${nf(+iN.value, 1)} cm⁻³`.replace('10^', '10').replace(/(\d+),(\d)/, (a, b, c2) => a) ;
    $('#pn-n-o').textContent = SI(N, '').trim() === '' ? '' : `${nf(N / Math.pow(10, Math.floor(+iN.value)), 1)}·10${String(Math.floor(+iN.value)).split('').map(ch => '⁰¹²³⁴⁵⁶⁷⁸⁹'[ch]).join('')} cm⁻³`;
    const { ctx, w: W, h: H } = fit(c), narrow = W < 560;
    const bx = 20, bw = W - 40, by = 22, bh = H * 0.5, X = um => bx + (um / span + 0.5) * bw;
    const xl = X(-w / 2), xr = X(w / 2);
    ctx.fillStyle = rgba(tok('--hole'), 0.1); ctx.fillRect(bx, by, X(0) - bx, bh);
    ctx.fillStyle = rgba(tok('--elec'), 0.1); ctx.fillRect(X(0), by, bx + bw - X(0), bh);
    ctx.fillStyle = tok('--surface'); ctx.fillRect(xl, by, xr - xl, bh);
    ctx.strokeStyle = tok('--rule'); ctx.strokeRect(bx + 0.5, by + 0.5, bw - 1, bh - 1);
    ctx.strokeStyle = tok('--muted'); ctx.setLineDash([4, 4]); ctx.beginPath(); ctx.moveTo(xl, by); ctx.lineTo(xl, by + bh); ctx.moveTo(xr, by); ctx.lineTo(xr, by + bh); ctx.stroke(); ctx.setLineDash([]);
    // freie Träger
    for (let k = 0; k < rnd.length; k++) { const [u, v] = rnd[k]; const pside = k % 2 === 0; const x = pside ? bx + u * (X(0) - bx) : X(0) + u * (bx + bw - X(0)); if (x > xl - 3 && x < xr + 3) continue; const y = by + 6 + v * (bh - 12);
      if (pside) { ctx.strokeStyle = tok('--hole'); ctx.lineWidth = 1.4; ctx.beginPath(); ctx.arc(x, y, 3, 0, 7); ctx.stroke(); } else { ctx.fillStyle = tok('--elec'); ctx.beginPath(); ctx.arc(x, y, 3, 0, 7); ctx.fill(); } }
    // Ionen in der RLZ
    ctx.font = `700 12px ${DISP}`; ctx.textAlign = 'center';
    const nI = Math.max(1, Math.round((xr - xl) / 14));
    for (let i = 0; i < nI; i++) for (let j = 0; j < 5; j++) { const x = xl + (i + 0.5) * (xr - xl) / nI, y = by + (j + 0.6) * bh / 5.4; const left = x < X(0); ctx.fillStyle = left ? tok('--hole') : tok('--elec'); ctx.fillText(left ? '−' : '+', x, y + 4); }
    // Feldpfeil
    if (xr - xl > 30) { const yA = by - 8; ctx.strokeStyle = tok('--fg'); ctx.fillStyle = tok('--fg'); ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(xr - 4, yA); ctx.lineTo(xl + 8, yA); ctx.stroke(); ctx.beginPath(); ctx.moveTo(xl + 2, yA); ctx.lineTo(xl + 10, yA - 4); ctx.lineTo(xl + 10, yA + 4); ctx.fill(); ctx.font = `11px ${MONO}`; ctx.textAlign = 'center'; ctx.fillText('E', (xl + xr) / 2, yA - 4); }
    ctx.font = `600 13px ${DISP}`; ctx.textAlign = 'left'; ctx.fillStyle = tok('--fg'); ctx.fillText('p', bx + 8, by + bh - 8); ctx.textAlign = 'right'; ctx.fillText('n', bx + bw - 8, by + bh - 8);
    // Feldprofil
    const py = by + bh + 14, ph = H - py - 30;
    const f = frame(ctx, 0, py, W, ph + 30, { x0: -span / 2, x1: span / 2, y0: 0, y1: 1.1, xt: ticks(-span / 2, span / 2).a, yt: [], xf: v => nf(v, ticks(-span / 2, span / 2).d), xl: 'Ort (µm)', yl: '|E|', l: 20, t: 4 });
    const Emax_ref = QE * N * (Math.sqrt(2 * EPS / QE * (2 / N) * (UD + 50)) / 2) / EPS;
    clipBox(ctx, f); ctx.fillStyle = rgba(tok('--accent'), 0.25); ctx.strokeStyle = tok('--accent'); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(f.X(-w / 2), f.Y(0)); ctx.lineTo(f.X(0), f.Y(Em / Emax_ref)); ctx.lineTo(f.X(w / 2), f.Y(0)); ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();
    const state = U > 0.3 ? 'Durchlassrichtung: Barriere fast abgebaut, Strom steigt exponentiell' : U < -0.05 ? 'Sperrrichtung: Zone verbreitert, nur kleiner Sperrstrom' : 'ohne äußere Spannung: Gleichgewicht';
    $('#pn-read').innerHTML = `<span class="k">Diffusionsspannung U_D:</span> ${nf(UD, 2)} V  <span class="k">·</span>  <span class="k">Breite der Raumladungszone:</span> ${w < 1 ? nf(w * 1000, 0) + ' nm' : nf(w, w < 10 ? 2 : 1) + ' µm'}  <span class="k">·</span>  <span class="k">maximales Feld:</span> ${SI(Em * 100, 'V/m')}<br><span class="k">${state}</span>`;
  }});
  [iU, iN].forEach(e => e.addEventListener('input', rafDebounce(() => m.draw()))); m.draw();
})();
</script>
