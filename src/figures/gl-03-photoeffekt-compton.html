<!-- title: Photoeffekt und Compton-Streuung

<figure class="fig">
<div class="svgbox">
<svg aria-label="Zwei Atom-Skizzen. Links Photoeffekt: Photon wird verschluckt, ein inneres Elektron fliegt heraus. Rechts Compton-Streuung: Photon stößt ein äußeres Elektron an und fliegt mit weniger Energie in andere Richtung weiter." role="img" viewbox="0 0 760 270">
<defs>
<marker id="ae" markerheight="7" markerwidth="7" orient="auto" refx="9" refy="5" viewbox="0 0 10 10"><path class="d-e" d="M0,0 L10,5 L0,10 z"></path></marker>
<marker id="ap" markerheight="7" markerwidth="7" orient="auto" refx="9" refy="5" viewbox="0 0 10 10"><path class="d-b2" d="M0,0 L10,5 L0,10 z"></path></marker>
</defs>
<text class="d-fg" font-size="16" font-weight="600" x="20" y="24">Photoeffekt</text>
<text class="d-mut" font-size="13" x="20" y="42">Photon wird komplett verschluckt</text>
<g transform="translate(220,150)">
<circle class="d-stm" r="78" stroke-dasharray="3 4"></circle><circle class="d-stm" r="44" stroke-dasharray="3 4"></circle>
<circle class="d-fg" r="10"></circle><text font-size="10" style="fill:var(--surface)" text-anchor="middle" x="0" y="4">+</text>
<circle class="d-surf" cx="44" cy="0" r="5" stroke-dasharray="2 2" style="stroke:var(--elec)"></circle>
<circle class="d-e" cx="-44" cy="0" r="5"></circle><circle class="d-e" cx="55" cy="-55" r="5"></circle><circle class="d-e" cx="-55" cy="55" r="5"></circle><circle class="d-e" cx="-70" cy="-35" r="5"></circle>
</g>
<path class="d-stb2" d="M30 150 q6 -8 12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0" stroke-width="2"></path>

<text class="d-mut" font-size="13" x="400" y="42">Photon gibt einen Teil ab und fliegt weiter</text>
<g transform="translate(590,150)">
<circle class="d-stm" r="78" stroke-dasharray="3 4"></circle><circle class="d-stm" r="44" stroke-dasharray="3 4"></circle>

<circle class="d-surf" cx="0" cy="-78" r="5" stroke-dasharray="2 2" style="stroke:var(--elec)"></circle>

</svg>

<figcaption><b>Abb. 3</b> Links: Beim Photoeffekt überträgt das Photon seine ganze Energie auf ein inneres Elektron und hört auf zu existieren. Rechts: Bei der Compton-Streuung stößt das Photon ein locker gebundenes Elektron an, gibt dabei einen Teil seiner Energie ab und fliegt in eine neue Richtung weiter.</figcaption>
