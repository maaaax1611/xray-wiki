<!-- title: Fourier-Reihe einer Rechteckwelle
     lib: rk -->
<figure class="fig">
<canvas aria-label="Eine Rechteckwelle wird aus einer wachsenden Zahl von Sinuswellen zusammengesetzt; daneben die Amplituden der einzelnen Frequenzen." class="c-fs" id="cv-fs" role="img"></canvas>
<div class="ctrls">
<div class="ctrl"><div class="lab"><label for="fs-k">Anzahl Sinuswellen</label><output id="fs-k-o"></output></div><input id="fs-k" max="30" min="1" step="1" type="range" value="4"/></div>
</div>
<figcaption><b>Abb. 1</b> Links: Eine Rechteckwelle (gestrichelt) wird aus Sinuswellen mit den Frequenzen 1, 3, 5, … aufgebaut, die zuletzt hinzugefügte ist hell eingezeichnet. Rechts: das Spektrum, also die Amplitude jeder Frequenz (\(4/\pi k\)). Für die steilen Kanten braucht man die hohen Frequenzen.</figcaption>
</figure>
<script>
/* ---------- Abb. 1: Fourier-Reihe ---------- */
(() => {
  const c = $('#cv-fs'), ik = $('#fs-k');
  const m = reg({ el: c, draw() {
    const K = +ik.value; $('#fs-k-o').textContent = `${K} (bis Frequenz ${2 * K - 1})`;
    const { ctx, w, h } = fit(c);
    const narrow = w < 560;
    const A = narrow ? [0, 0, w, h * 0.55] : [0, 0, w * 0.58, h], B = narrow ? [0, h * 0.57, w, h * 0.43] : [w * 0.6, 0, w * 0.4, h];
    let f = frame(ctx, A[0], A[1], A[2], A[3], { x0: 0, x1: 2, y0: -1.45, y1: 1.45, xt: [0, 0.5, 1, 1.5, 2], yt: [-1, 0, 1], xf: v => nf(v, 1), yf: v => nf(v, 0), xl: 'Ort x (Perioden)', yl: 'Signal', l: 40 });
    clipBox(ctx, f);
    ctx.strokeStyle = tok('--muted'); ctx.setLineDash([5, 4]); ctx.lineWidth = 1.3; ctx.beginPath();
    [[0, 1], [0.5, 1], [0.5, -1], [1, -1], [1, 1], [1.5, 1], [1.5, -1], [2, -1]].forEach(([x, y], i) => i ? ctx.lineTo(f.X(x), f.Y(y)) : ctx.moveTo(f.X(x), f.Y(y))); ctx.stroke(); ctx.setLineDash([]);
    const kk = 2 * K - 1;
    ctx.strokeStyle = rgba(tok('--bin2'), 0.7); ctx.lineWidth = 1.3; ctx.beginPath();
    for (let i = 0; i <= 600; i++) { const x = 2 * i / 600, y = 4 / (Math.PI * kk) * Math.sin(2 * Math.PI * kk * x); i ? ctx.lineTo(f.X(x), f.Y(y)) : ctx.moveTo(f.X(x), f.Y(y)); } ctx.stroke();
    ctx.strokeStyle = tok('--accent'); ctx.lineWidth = 2.2; ctx.beginPath();
    for (let i = 0; i <= 800; i++) { const x = 2 * i / 800; let y = 0; for (let k = 1; k <= kk; k += 2) y += 4 / (Math.PI * k) * Math.sin(2 * Math.PI * k * x); i ? ctx.lineTo(f.X(x), f.Y(y)) : ctx.moveTo(f.X(x), f.Y(y)); } ctx.stroke();
    ctx.restore();
    f = frame(ctx, B[0], B[1], B[2], B[3], { x0: 0, x1: 60, y0: 0, y1: 1.4, xt: [0, 10, 20, 30, 40, 50, 60], yt: [0, 0.5, 1], yf: v => nf(v, 1), xl: 'Frequenz k', yl: 'Amplitude', l: 40 });
    for (let k = 1; k <= 59; k += 2) {
      const a = 4 / (Math.PI * k), on = k <= kk;
      ctx.fillStyle = on ? (k === kk ? tok('--bin2') : tok('--accent')) : rgba(tok('--muted'), 0.25);
      const bw = Math.max(2, f.bw / 60 * 0.9); ctx.fillRect(f.X(k) - bw / 2, f.Y(a), bw, f.Y(0) - f.Y(a));
    }
  }});
  ik.addEventListener('input', () => m.draw()); m.draw();
})();
</script>
