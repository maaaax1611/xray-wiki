<style>

  --bin1: #14937f;

  --font-body: "Source Serif 4", Georgia, "Times New Roman", serif;

}

  :root:not([data-theme="light"]) {
    --bg: #0d131a; --surface: #131b24; --fg: #e2e8ee; --muted: #93a1af; --rule: #263240; --grid: #1c2632;
    --accent: #7d9cf2; --accent-soft: #1b2a4d; --elec: #5f95f0; --hole: #ef6b78;

}

  --accent: #7d9cf2; --accent-soft: #1b2a4d; --elec: #5f95f0; --hole: #ef6b78;

.d-ste { stroke: var(--elec); fill: none; } .d-stb2 { stroke: var(--bin2); fill: none; }

<body>
<main class="widget">
<figure class="fig">
        <canvas id="cv-tube" class="c-tube" role="img" aria-label="Animation einer Röntgenröhre: Elektronen werden zur Anode beschleunigt, erzeugen Photonen unterschiedlicher Energie, ein Filter absorbiert weiche Photonen. Daneben füllt sich ein Histogramm des Spektrums."></canvas>
        <div class="ctrls">
          <div class="ctrl"><div class="lab"><label for="tb-kv">Röhrenspannung</label><output id="tb-kv-o"></output></div><input id="tb-kv" type="range" min="40" max="140" step="5" value="120"></div>
          <div class="ctrl"><div class="lab"><label for="tb-al">Filter (Aluminium)</label><output id="tb-al-o"></output></div><input id="tb-al" type="range" min="0" max="12" step="0.5" value="3"></div>
          <button class="btn" type="button" id="tb-play">Pause</button>
        </div>
        <figcaption><b>Abb. 2</b> Links: Elektronen (blau) fliegen von der Kathode zur Anode und erzeugen dort Photonen, eingefärbt nach Energie. Im Filter verschwindet ein Teil, vor allem die weichen. Rechts: Histogramm der Photonen, die den Filter passiert haben, und die berechnete Kurve dazu (gestrichelt: ohne Filter). Für eine glatte Kurve fließen zusätzlich viele nicht gezeichnete Photonen ins Histogramm ein.</figcaption>
      </figure>
</main>
<script>
(() => {

'use strict';
const $ = s => document.querySelector(s);
const root = document.documentElement;
const tok = n => getComputedStyle(root).getPropertyValue(n).trim();
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const MONO = '"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace';
const DISP = '"IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif';
const nf = (v, d = 0) => v.toLocaleString('de-DE', { minimumFractionDigits: d, maximumFractionDigits: d });
function rgb(c) { c = c.replace('#', ''); if (c.length === 3) c = c.split('').map(x => x + x).join(''); const v = parseInt(c, 16); return [v >> 16 & 255, v >> 8 & 255, v & 255]; }
function rgba(c, a) { const [r, g, b] = rgb(c); return `rgba(${r},${g},${b},${a})`; }
function gauss() { let u = 0; while (u === 0) u = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * Math.random()); }
function fit(c) {
  const r = c.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
  const w = Math.max(1, r.width), h = Math.max(1, r.height), W = Math.round(w * dpr), H = Math.round(h * dpr);
  if (c.width !== W || c.height !== H) { c.width = W; c.height = H; }
  const ctx = c.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, w, h);
  return { ctx, w, h };
}
const SUP = { '-': '⁻', '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹' };
function frame(ctx, x0px, y0px, w, h, o) {
  const L = o.l ?? 48, R = o.r ?? 12, T = o.t ?? 12, B = o.b ?? 36;
  const bx = x0px + L, by = y0px + T, bw = Math.max(10, w - L - R), bh = Math.max(10, h - T - B);
  const X = v => bx + (v - o.x0) / (o.x1 - o.x0) * bw;
  const Y = v => by + bh - (v - o.y0) / (o.y1 - o.y0) * bh;
  ctx.font = `11px ${MONO}`; ctx.lineWidth = 1;
  const grid = tok('--grid'), muted = tok('--muted');
  for (const v of (o.xt || [])) { const x = X(v); ctx.strokeStyle = grid; ctx.beginPath(); ctx.moveTo(x, by); ctx.lineTo(x, by + bh); ctx.stroke(); ctx.fillStyle = muted; ctx.textAlign = 'center'; ctx.fillText(o.xf ? o.xf(v) : String(v), x, by + bh + 15); }
  for (const v of (o.yt || [])) { const y = Y(v); ctx.strokeStyle = grid; ctx.beginPath(); ctx.moveTo(bx, y); ctx.lineTo(bx + bw, y); ctx.stroke(); ctx.fillStyle = muted; ctx.textAlign = 'right'; ctx.fillText(o.yf ? o.yf(v) : String(v), bx - 6, y + 4); }
  ctx.strokeStyle = tok('--rule'); ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx, by + bh); ctx.lineTo(bx + bw, by + bh); ctx.stroke();
  ctx.fillStyle = muted; ctx.font = `12px ${DISP}`;
  if (o.xl) { ctx.textAlign = 'center'; ctx.fillText(o.xl, bx + bw / 2, by + bh + 31); }
  if (o.yl) { ctx.save(); ctx.translate(x0px + 12, by + bh / 2); ctx.rotate(-Math.PI / 2); ctx.textAlign = 'center'; ctx.fillText(o.yl, 0, 0); ctx.restore(); }
  return { X, Y, bx, by, bw, bh };
}
function clipBox(ctx, f) { ctx.save(); ctx.beginPath(); ctx.rect(f.bx, f.by, f.bw, f.bh); ctx.clip(); }
const BINC = ['--bin0', '--bin1', '--bin2', '--bin3'];

const mods = [];
const io = new IntersectionObserver(es => es.forEach(e => { if (e.target._mod) e.target._mod.visible = e.isIntersecting; }), { rootMargin: '100px' });
function reg(m) { m.visible = true; m.el._mod = m; io.observe(m.el); mods.push(m); new ResizeObserver(() => m.draw()).observe(m.el); return m; }
const redrawAll = () => mods.forEach(m => m.draw());
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', redrawAll);
new MutationObserver(redrawAll).observe(root, { attributes: true, attributeFilter: ['data-theme'] });
let last = performance.now();
function loop(now) { const dt = Math.min(0.05, (now - last) / 1000); last = now; for (const m of mods) if (m.anim && m.playing && m.visible) { m.step(dt); m.draw(); } requestAnimationFrame(loop); }
requestAnimationFrame(loop);
function playBtn(btn, m) { btn.addEventListener('click', () => { m.playing = !m.playing; btn.textContent = m.playing ? 'Pause' : 'Abspielen'; }); if (!m.playing) btn.textContent = 'Abspielen'; }

/* Schwächungsdaten (cm²/g), genähert nach NIST XCOM */
const WATER = [[10,5.33],[15,1.67],[20,0.81],[30,0.376],[40,0.268],[50,0.227],[60,0.206],[80,0.184],[100,0.171],[150,0.150]];
const BONE  = [[10,28.5],[15,9.0],[20,4.0],[30,1.33],[40,0.665],[50,0.424],[60,0.315],[80,0.223],[100,0.186],[150,0.148]];
const AL    = [[10,26.2],[15,7.96],[20,3.44],[30,1.13],[40,0.568],[50,0.368],[60,0.278],[80,0.202],[100,0.170],[150,0.138]];
function mu(t, E) {
  if (E <= t[0][0]) return t[0][1];
  for (let i = 0; i < t.length - 1; i++) if (E <= t[i + 1][0]) { const [e0, m0] = t[i], [e1, m1] = t[i + 1]; const f = Math.log(E / e0) / Math.log(e1 / e0); return Math.exp(Math.log(m0) + f * Math.log(m1 / m0)); }
  return t[t.length - 1][1];
}
function kleinNishina(EkeV) { // cm² pro Elektron
  const k = EkeV / 511, re2 = 7.9407e-26, l = Math.log(1 + 2 * k);
  return 2 * Math.PI * re2 * ((1 + k) / (k * k) * (2 * (1 + k) / (1 + 2 * k) - l / k) + l / (2 * k) - (1 + 3 * k) / ((1 + 2 * k) ** 2));
}
const EG = []; for (let e = 10; e <= 150.001; e += 0.5) EG.push(Math.round(e * 10) / 10);
function tube(kvp, alMm) {
  const g = (E, c) => Math.exp(-0.5 * ((E - c) / 0.45) ** 2);
  return EG.map(E => {
    if (E >= kvp) return 0;
    let n = (kvp - E) / E;
    if (kvp > 69.5) { const a = 1.3 * (kvp - 69.5) / 50; n += a * (g(E, 59.3) + 0.55 * g(E, 58.0) + 0.32 * g(E, 67.2)); }
    return n * Math.exp(-mu(AL, E) * 2.7 * (1 + alMm) / 10);
  });
}
function sampler(spec) {
  const cdf = []; let s = 0; for (const v of spec) { s += v; cdf.push(s); }
  return () => { const u = Math.random() * s; let lo = 0, hi = cdf.length - 1; while (lo < hi) { const m = (lo + hi) >> 1; if (cdf[m] < u) lo = m + 1; else hi = m; } return EG[lo] + (Math.random() - 0.5) * 0.5; };
}
const ebin = E => E < 40 ? 0 : E < 60 ? 1 : E < 80 ? 2 : 3;

/* ---------- Abb. 2: Röhre ---------- */
(() => {
  const c = $('#cv-tube'), ikv = $('#tb-kv'), ial = $('#tb-al');
  const BW = 2, NB = 75;
  let hist, el, ph, sampRaw, specF, specRaw, spawn = 0;
  function reset() {
    const kv = +ikv.value, al = +ial.value;
    $('#tb-kv-o').textContent = `${kv} kV`; $('#tb-al-o').textContent = `${nf(al, 1)} mm`;
    specRaw = tube(kv, 0); specF = tube(kv, al); sampRaw = sampler(specRaw);
    hist = new Float64Array(NB); el = []; ph = [];
    for (let i = 0; i < 4000; i++) bg();
  }
  function passes(E) { return Math.random() < Math.exp(-mu(AL, E) * 2.7 * (+ial.value) / 10); }
  function bg() { const E = sampRaw(); if (passes(E)) { const b = Math.floor(E / BW); if (b < NB) hist[b]++; } }
  function lay(w, h) {
    const narrow = w < 560;
    return narrow ? { t: [0, 0, w, h * 0.5], p: [0, h * 0.5, w, h * 0.5] } : { t: [0, 0, w * 0.46, h], p: [w * 0.49, 0, w * 0.51, h] };
  }
  const m = reg({ el: c, anim: true, playing: !reduceMotion,
    step(dt) {
      spawn += dt * 7;
      while (spawn > 1) { spawn--; el.push({ t: 0 }); }
      el.forEach(e => e.t += dt / 0.7);
      el = el.filter(e => { if (e.t >= 1) { const E = sampRaw(); const pass = passes(E); ph.push({ E, ang: (Math.random() - 0.5) * 0.5, t: 0, pass, dead: false }); if (pass) { const b = Math.floor(E / BW); if (b < NB) hist[b]++; } return false; } return true; });
      ph.forEach(p => p.t += dt);
      ph = ph.filter(p => p.t < 1.6);
      for (let i = 0; i < 25; i++) bg();
    },
    draw() {
      const { ctx, w, h } = fit(c);
      const Ly = lay(w, h), [tx, ty, tw, th] = Ly.t;
      const fg = tok('--fg'), mut = tok('--muted'), acc = tok('--accent');
      // Röhre
      const cy = ty + th * 0.32, gx = tx + 8, gw = tw - 16, gh = th * 0.42;
      ctx.strokeStyle = mut; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.roundRect ? ctx.roundRect(gx, cy - gh / 2, gw, gh, gh / 2) : ctx.rect(gx, cy - gh / 2, gw, gh); ctx.stroke();
      ctx.font = `11px ${DISP}`; ctx.fillStyle = mut; ctx.textAlign = 'left'; ctx.fillText('Vakuum', gx + gh * 0.4, cy - gh / 2 + 14);
      const kx = gx + gw * 0.14, ax = gx + gw * 0.76;
      // Kathode (Glühwendel)
      ctx.strokeStyle = tok('--bin2'); ctx.lineWidth = 2; ctx.beginPath();
      for (let i = 0; i <= 24; i++) { const y = cy - 10 + i * 20 / 24, x = kx + 4 * Math.sin(i * 1.6); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); } ctx.stroke();
      ctx.fillStyle = fg; ctx.font = `12px ${DISP}`; ctx.textAlign = 'center'; ctx.fillText('Kathode −', kx, cy + gh / 2 + 16);
      // Anode
      ctx.fillStyle = rgba(fg, 0.75); ctx.beginPath(); ctx.moveTo(ax, cy - 18); ctx.lineTo(ax + 26, cy - 18); ctx.lineTo(ax + 26, cy + 18); ctx.lineTo(ax + 10, cy + 18); ctx.closePath(); ctx.fill();
      ctx.fillStyle = fg; ctx.fillText('Anode + (W)', ax + 12, cy + gh / 2 + 16);
      // Hochspannung
      ctx.fillStyle = mut; ctx.font = `11px ${MONO}`; ctx.fillText(`U = ${ikv.value} kV`, (kx + ax) / 2, cy - gh / 2 - 6);
      // Elektronen
      ctx.fillStyle = tok('--elec');
      el.forEach(e => { const x = kx + 6 + (ax + 4 - kx - 6) * e.t * e.t; ctx.beginPath(); ctx.arc(x, cy + Math.sin(e.t * 9 + x) * 1.5, 2.6, 0, 7); ctx.fill(); });
      // Filter
      const fy = cy + gh / 2 + 30, fth = 3 + (+ial.value) * 1.4;
      ctx.fillStyle = rgba(mut, 0.45); ctx.fillRect(ax - 34, fy, 70, fth);
      ctx.fillStyle = mut; ctx.font = `11px ${DISP}`; ctx.textAlign = 'left'; ctx.fillText('Al-Filter', ax + 40, fy + fth / 2 + 4);
      // Photonen
      const yEnd = ty + th - 4;
      ph.forEach(p => {
        const sx = ax + 12, sy = cy + 8, dist = p.t * (yEnd - sy) / 1.2;
        let yy = sy + dist * Math.cos(p.ang), xx = sx + dist * Math.sin(p.ang);
        if (!p.pass && yy > fy) { if (yy < fy + 40) { const a = 1 - (yy - fy) / 40; ctx.fillStyle = rgba(tok(BINC[ebin(p.E)]), 0.6 * a); ctx.beginPath(); ctx.arc(sx + (fy - sy) * Math.tan(p.ang), fy + fth / 2, 6 * (1 - a) + 2, 0, 7); ctx.fill(); } return; }
        if (yy > yEnd) return;
        ctx.strokeStyle = rgba(tok(BINC[ebin(p.E)]), 0.5); ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(xx - 10 * Math.sin(p.ang), yy - 10 * Math.cos(p.ang)); ctx.lineTo(xx, yy); ctx.stroke();
        ctx.fillStyle = tok(BINC[ebin(p.E)]); ctx.beginPath(); ctx.arc(xx, yy, 3.2, 0, 7); ctx.fill();
      });
      // Legende Energiefarben
      ctx.font = `10.5px ${MONO}`; ctx.textAlign = 'left';
      ['<40', '40–60', '60–80', '≥80 keV'].forEach((t, k) => { const lx = tx + 8 + k * Math.min(62, tw / 4.3), ly = ty + 12; ctx.fillStyle = tok(BINC[k]); ctx.fillRect(lx, ly - 7, 8, 8); ctx.fillStyle = mut; ctx.fillText(t, lx + 11, ly); });
      // Histogramm
      const [px, py, pw, phh] = Ly.p;
      const kv = +ikv.value;
      let mx = 1; for (let i = 0; i < NB; i++) mx = Math.max(mx, hist[i]);
      const f = frame(ctx, px, py, pw, phh, { x0: 0, x1: 150, y0: 0, y1: 1.12, xt: [0, 30, 60, 90, 120, 150], yt: [], xl: 'Photonenenergie (keV)', yl: 'Anzahl', l: 24, t: 30 });
      clipBox(ctx, f);
      for (let i = 0; i < NB; i++) { const E = i * BW, v = hist[i] / mx; if (!v) continue; ctx.fillStyle = rgba(tok(BINC[ebin(E + 1)]), 0.75); ctx.fillRect(f.X(E) + 0.5, f.Y(v), f.X(E + BW) - f.X(E) - 1, f.Y(0) - f.Y(v)); }
      // Kurven skalieren auf Histogramm
      let tot = 0; for (let i = 0; i < NB; i++) tot += hist[i];
      const sF = specF.reduce((a, b) => a + b, 0) || 1;
      const scale = tot / sF * (BW / 0.5) / mx;
      ctx.strokeStyle = fg; ctx.lineWidth = 1.6; ctx.beginPath(); specF.forEach((v, i) => { const x = f.X(EG[i]), y = f.Y(v * scale); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); ctx.stroke();
      ctx.strokeStyle = mut; ctx.setLineDash([4, 4]); ctx.lineWidth = 1.3; ctx.beginPath(); specRaw.forEach((v, i) => { const x = f.X(EG[i]), y = f.Y(v * scale); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); ctx.stroke(); ctx.setLineDash([]);
      ctx.strokeStyle = tok('--hole'); ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(f.X(kv), f.by); ctx.lineTo(f.X(kv), f.by + f.bh); ctx.stroke();
      ctx.restore();
      ctx.font = `11px ${MONO}`; ctx.fillStyle = tok('--hole'); ctx.textAlign = 'right'; ctx.fillText(`E_max = ${kv} keV`, f.bx + f.bw, py + 14);
      let sumE = 0, sumN = 0; specF.forEach((v, i) => { sumE += v * EG[i]; sumN += v; });
      ctx.fillStyle = fg; ctx.textAlign = 'left'; ctx.fillText(`mittlere Energie: ${nf(sumE / sumN, 1)} keV`, f.bx + 4, py + 14);
    }
  });
  ikv.addEventListener('input', () => { reset(); m.draw(); }); ial.addEventListener('input', () => { reset(); m.draw(); });
  reset(); playBtn($('#tb-play'), m); m.draw();
})();

})();
</script>
