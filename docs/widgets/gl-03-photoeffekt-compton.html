<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photoeffekt und Compton-Streuung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: Lernpfad in sieben Bausteinen. Lesespalte mit klebrigem Inhaltsverzeichnis, jede Abbildung ein kleines Experiment. */
:root {
  --bg: #f2f4f6;
  --surface: #fbfcfd;
  --fg: #16202a;
  --muted: #5a6875;
  --rule: #d3dae1;
  --grid: #e3e8ed;
  --accent: #2448b8;
  --accent-soft: #dfe6fa;
  --elec: #2b66d9;
  --hole: #c8424f;
  --bin0: #3a6fd8;
  --bin1: #14937f;
  --bin2: #c9900e;
  --bin3: #c8424f;
  --font-display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Source Serif 4", Georgia, "Times New Roman", serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d131a; --surface: #131b24; --fg: #e2e8ee; --muted: #93a1af; --rule: #263240; --grid: #1c2632;
    --accent: #7d9cf2; --accent-soft: #1b2a4d; --elec: #5f95f0; --hole: #ef6b78;
    --bin0: #6a96f0; --bin1: #34c2aa; --bin2: #e7b43c; --bin3: #ef6b78;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d131a; --surface: #131b24; --fg: #e2e8ee; --muted: #93a1af; --rule: #263240; --grid: #1c2632;
  --accent: #7d9cf2; --accent-soft: #1b2a4d; --elec: #5f95f0; --hole: #ef6b78;
  --bin0: #6a96f0; --bin1: #34c2aa; --bin2: #e7b43c; --bin3: #ef6b78;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 17px; line-height: 1.62; -webkit-font-smoothing: antialiased; }
.wrap { max-width: 1160px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 40px 80px; }
@media (min-width: 1100px) {
  .wrap { display: grid; grid-template-columns: 210px minmax(0, 1fr); gap: 56px; }
  nav.toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 28px); align-self: start; max-height: calc(100vh - 56px); overflow: auto; }
  .toc-mobile { display: none; }
}
@media (max-width: 1099px) { nav.toc { display: none; } }
main { min-width: 0; max-width: 800px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; line-height: 1.12; margin: 0; }
h1 { font-size: clamp(2.6rem, 7vw, 4.6rem); font-weight: 700; letter-spacing: -0.01em; }
h2 { font-size: clamp(1.6rem, 3.6vw, 2.15rem); font-weight: 600; margin-top: 10px; }
h3 { font-size: 1.22rem; font-weight: 600; margin-top: 1.8em; }
p { margin: 0.9em 0; }
a { color: var(--accent); }
strong { font-weight: 600; }
.eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); }
.lede { font-size: 1.2rem; line-height: 1.5; max-width: 34em; margin-top: 18px; }
.muted { color: var(--muted); }
nav.toc { font-family: var(--font-display); font-size: 15px; }
nav.toc ol { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 2px; }
nav.toc a { display: grid; grid-template-columns: 26px 1fr; gap: 6px; text-decoration: none; color: var(--muted); padding: 5px 8px; border-radius: 4px; }
nav.toc a:hover, nav.toc a:focus-visible { color: var(--fg); background: var(--surface); }
nav.toc a.on { color: var(--fg); background: var(--accent-soft); }
nav.toc .n { font-family: var(--font-mono); font-size: 12px; padding-top: 2px; }
.toc-mobile { margin: 28px 0 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding: 10px 0; font-family: var(--font-display); }
.toc-mobile summary { cursor: pointer; color: var(--muted); }
.toc-mobile ol { margin: 8px 0 4px; padding-left: 1.4em; }
section { padding-top: 64px; scroll-margin-top: 20px; }
.step { display: flex; align-items: center; gap: 10px; }
.step b { font-family: var(--font-mono); font-size: 12px; font-weight: 500; color: var(--surface); background: var(--accent); border-radius: 3px; padding: 1px 7px; }
figure.fig { margin: 28px 0; background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; padding: 16px; }
figure.fig figcaption { font-size: 14.5px; line-height: 1.5; color: var(--muted); margin-top: 12px; }
figure.fig figcaption b { color: var(--fg); font-family: var(--font-display); font-weight: 600; }
canvas { display: block; width: 100%; max-width: 100%; }
.c-em { aspect-ratio: 2.4 / 1; } .c-tube { aspect-ratio: 2.1 / 1; } .c-att { aspect-ratio: 2.2 / 1; }
.c-pair { aspect-ratio: 2.4 / 1; } .c-drift { aspect-ratio: 2 / 1; } .c-int { aspect-ratio: 2.6 / 1; } .c-sq { aspect-ratio: 1 / 1; }
@media (max-width: 560px) { .c-em { aspect-ratio: 1.5 / 1; } .c-tube, .c-att, .c-drift { aspect-ratio: 0.85 / 1; } .c-pair { aspect-ratio: 1.4 / 1; } .c-int { aspect-ratio: 1.5 / 1; } }
.three { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.three .lbl { font-family: var(--font-display); font-size: 14px; color: var(--muted); margin-bottom: 6px; }
@media (max-width: 640px) { .three { grid-template-columns: minmax(0, 1fr); } }
.svgbox { overflow-x: auto; }
.svgbox svg { display: block; width: 100%; min-width: 600px; height: auto; }
.ctrls { display: flex; flex-wrap: wrap; gap: 12px 20px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--rule); align-items: end; }
.ctrl { display: grid; gap: 2px; flex: 1 1 170px; min-width: 0; }
.ctrl .lab { display: flex; justify-content: space-between; gap: 8px; font-family: var(--font-display); font-size: 14px; color: var(--muted); }
.ctrl output { font-family: var(--font-mono); font-size: 12.5px; color: var(--fg); font-variant-numeric: tabular-nums; white-space: nowrap; }
input[type="range"] { width: 100%; accent-color: var(--accent); margin: 4px 0; }
select { font-family: var(--font-display); font-size: 14px; color: var(--fg); background: var(--bg); border: 1px solid var(--rule); border-radius: 4px; padding: 5px 8px; }
.btn { font-family: var(--font-display); font-size: 14px; font-weight: 600; color: var(--fg); background: var(--bg); border: 1px solid var(--rule); border-radius: 4px; padding: 6px 12px; cursor: pointer; }
.btn:hover { border-color: var(--muted); }
.btn:focus-visible, input:focus-visible, select:focus-visible, nav a:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.chk { display: flex; gap: 8px; align-items: center; font-family: var(--font-display); font-size: 14px; flex: 0 0 auto; }
.chk input { accent-color: var(--accent); width: 16px; height: 16px; }
.readout { font-family: var(--font-mono); font-size: 13px; font-variant-numeric: tabular-nums; margin-top: 10px; line-height: 1.7; }
.readout .k { color: var(--muted); }
.tbl { overflow-x: auto; margin: 20px 0; }
table { border-collapse: collapse; width: 100%; font-size: 15px; }
th, td { text-align: left; padding: 7px 12px 7px 0; border-bottom: 1px solid var(--rule); vertical-align: top; }
th { font-family: var(--font-display); font-weight: 600; color: var(--muted); font-size: 14px; }
td.num, th.num { font-family: var(--font-mono); font-size: 13px; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.eq { overflow-x: auto; overflow-y: hidden; margin: 18px 0; padding: 4px 0; }
mjx-container[display="true"] { margin: 0.6em 0 !important; }
.sym { display: grid; grid-template-columns: max-content 1fr; gap: 3px 14px; font-size: 15px; margin: -4px 0 18px; padding-left: 4px; }
.sym dt { font-family: var(--font-mono); font-size: 14px; }
.sym dd { margin: 0; color: var(--muted); }
.merke { background: var(--accent-soft); border-radius: 6px; padding: 12px 16px; margin: 26px 0; }
.merke .eyebrow { color: var(--accent); }
.merke p, .merke ul { margin: 0.35em 0; }
.merke ul { padding-left: 1.2em; }
ul.tight { padding-left: 1.2em; } ul.tight li { margin: 0.35em 0; }
footer { margin-top: 72px; padding-top: 20px; border-top: 1px solid var(--rule); font-size: 14px; color: var(--muted); }
.d-fg { fill: var(--fg); } .d-mut { fill: var(--muted); } .d-acc { fill: var(--accent); } .d-surf { fill: var(--surface); } .d-soft { fill: var(--accent-soft); } .d-bg { fill: var(--bg); }
.d-st { stroke: var(--fg); fill: none; } .d-stm { stroke: var(--muted); fill: none; } .d-sta { stroke: var(--accent); fill: none; }
.d-e { fill: var(--elec); } .d-h { fill: var(--hole); } .d-b2 { fill: var(--bin2); }
.d-ste { stroke: var(--elec); fill: none; } .d-stb2 { stroke: var(--bin2); fill: none; }
svg text { font-family: var(--font-display); }
svg text.m { font-family: var(--font-mono); }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

body { margin: 0; } .widget { padding: 4px; max-width: 900px; margin: 0 auto; } figure.fig { margin: 0 0 12px; } figure.fig + figure.fig { margin-top: 12px; }
:root.noframe figure.fig { border: 0; padding: 4px; background: transparent; } :root.noframe body { background: transparent; }</style>
<script>try{var t=new URLSearchParams(location.search).get("theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
<script>try{if(new URLSearchParams(location.search).get("frame")==="0")document.documentElement.classList.add("noframe");}catch(e){}</script>
</head>
<body>
<main class="widget">
<figure class="fig">
        <div class="svgbox">
        <svg viewBox="0 0 760 270" role="img" aria-label="Zwei Atom-Skizzen. Links Photoeffekt: Photon wird verschluckt, ein inneres Elektron fliegt heraus. Rechts Compton-Streuung: Photon stößt ein äußeres Elektron an und fliegt mit weniger Energie in andere Richtung weiter.">
          <defs>
            <marker id="ae" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="d-e"/></marker>
            <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="d-b2"/></marker>
          </defs>
          <text x="20" y="24" class="d-fg" font-size="16" font-weight="600">Photoeffekt</text>
          <text x="20" y="42" class="d-mut" font-size="13">Photon wird komplett verschluckt</text>
          <g transform="translate(220,150)">
            <circle r="78" class="d-stm" stroke-dasharray="3 4"/><circle r="44" class="d-stm" stroke-dasharray="3 4"/>
            <circle r="10" class="d-fg"/><text x="0" y="4" text-anchor="middle" font-size="10" style="fill:var(--surface)">+</text>
            <circle cx="44" cy="0" r="5" class="d-surf" style="stroke:var(--elec)" stroke-dasharray="2 2"/>
            <circle cx="-44" cy="0" r="5" class="d-e"/><circle cx="55" cy="-55" r="5" class="d-e"/><circle cx="-55" cy="55" r="5" class="d-e"/><circle cx="-70" cy="-35" r="5" class="d-e"/>
          </g>
          <path d="M30 150 q6 -8 12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0" class="d-stb2" stroke-width="2"/>
          <text x="40" y="180" class="d-fg m" font-size="11">Photon, E</text>
          <line x1="264" y1="150" x2="370" y2="80" class="d-ste" stroke-width="2" marker-end="url(#ae)"/>
          <text x="300" y="72" class="d-fg" font-size="13">Photoelektron</text>
          <text x="300" y="88" class="d-mut m" font-size="11">E − Bindungsenergie</text>
          <text x="20" y="252" class="d-mut" font-size="12">dominiert bei niedriger Energie und schweren Atomen</text>

          <text x="400" y="24" class="d-fg" font-size="16" font-weight="600">Compton-Streuung</text>
          <text x="400" y="42" class="d-mut" font-size="13">Photon gibt einen Teil ab und fliegt weiter</text>
          <g transform="translate(590,150)">
            <circle r="78" class="d-stm" stroke-dasharray="3 4"/><circle r="44" class="d-stm" stroke-dasharray="3 4"/>
            <circle r="10" class="d-fg"/><text x="0" y="4" text-anchor="middle" font-size="10" style="fill:var(--surface)">+</text>
            <circle cx="44" cy="0" r="5" class="d-e"/><circle cx="-44" cy="0" r="5" class="d-e"/><circle cx="-55" cy="55" r="5" class="d-e"/>
            <circle cx="0" cy="-78" r="5" class="d-surf" style="stroke:var(--elec)" stroke-dasharray="2 2"/>
          </g>
          <path d="M400 72 q6 -8 12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t10 0" class="d-stb2" stroke-width="2"/>
          <text x="410" y="100" class="d-fg m" font-size="11">Photon, E</text>
          <line x1="590" y1="72" x2="700" y2="40" class="d-stb2" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ap)"/>
          <text x="660" y="62" class="d-fg m" font-size="11">E′ &lt; E</text>
          <line x1="590" y1="72" x2="660" y2="185" class="d-ste" stroke-width="2" marker-end="url(#ae)"/>
          <text x="666" y="196" class="d-fg" font-size="13">Elektron</text>
          <text x="400" y="252" class="d-mut" font-size="12">dominiert bei höherer Energie und leichten Atomen (Gewebe)</text>
        </svg>
        </div>
        <figcaption><b>Abb. 3</b> Links: Beim Photoeffekt überträgt das Photon seine ganze Energie auf ein inneres Elektron und hört auf zu existieren. Rechts: Bei der Compton-Streuung stößt das Photon ein locker gebundenes Elektron an, gibt dabei einen Teil seiner Energie ab und fliegt in eine neue Richtung weiter.</figcaption>
      </figure>
</main>

</body>
</html>
