<style>
/* Layout: lange Lektüre-Spalte mit klebrigem Inhaltsverzeichnis links; Abbildungen als "Messplätze" in der Spalte. Tiefe = Ebene 1–5. */

}

    --accent: #7d9cf2; --accent-soft: #1b2a4d; --elec: #5f95f0; --hole: #ef6b78;
    --bin0: #6a96f0; --bin1: #34c2aa; --bin2: #e7b43c; --bin3: #ef6b78;

  }
}
:root[data-theme="dark"] {
  --bg: #0d131a; --surface: #131b24; --fg: #e2e8ee; --muted: #93a1af; --rule: #263240; --grid: #1c2632;
  --accent: #7d9cf2; --accent-soft: #1b2a4d; --elec: #5f95f0; --hole: #ef6b78;
  --bin0: #6a96f0; --bin1: #34c2aa; --bin2: #e7b43c; --bin3: #ef6b78;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg);

/* SVG-Diagramme */

<body>
<main class="widget">
<figure class="fig">
        <canvas id="cv-pulse" class="c-pulse" role="img" aria-label="Simuliertes Signal am Ausgang des Pulsformers mit vier Schwellen. Bei hoher Rate überlappen sich Pulse."></canvas>
        <div class="ctrls">
          <div class="ctrl"><div class="lab"><label for="pl-rate">Rate pro Pixel</label><output id="pl-rate-o"></output></div><input id="pl-rate" type="range" min="-0.3" max="2.3" step="0.01" value="0.7"></div>
          <div class="ctrl"><div class="lab"><label for="pl-tp">Peaking-Zeit τ_p</label><output id="pl-tp-o"></output></div><input id="pl-tp" type="range" min="4" max="40" step="1" value="10"></div>
          <button class="btn" type="button" id="pl-play">Pause</button>
        </div>
        <div class="tbl" style="margin:12px 0 0"><table class="small" id="pl-table"></table></div>
        <figcaption><b>Abb. 5</b> Simulierter Ausgang des Pulsformers (CR-RC-Pulsform, 0,7 keV Rauschen), Photonenenergien aus einem 120-kV-Spektrum hinter 10 cm Wasser. Die Striche am unteren Rand markieren die wahren Ankunftszeiten, eingefärbt nach wahrer Energie. Die Tabelle stammt aus einer schnelleren Hintergrundsimulation mit denselben Parametern. Erhöhe die Rate: Pulse verschmelzen (Pile-up), Zählungen gehen verloren, und gleichzeitig wandern Ereignisse in höhere Bins.</figcaption>
      </figure>
</main>
<script>
(() => {

'use strict';
const $ = s => document.querySelector(s);
const root = document.documentElement;
const tok = n => getComputedStyle(root).getPropertyValue(n).trim();
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const MONO = '"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace';
const DISP = '"IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif';
const nf = (v, d=0) => v.toLocaleString('de-DE', {minimumFractionDigits:d, maximumFractionDigits:d});

function rgb(c) {
  c = c.replace('#','');
  if (c.length === 3) c = c.split('').map(x => x + x).join('');
  const v = parseInt(c, 16); return [v >> 16 & 255, v >> 8 & 255, v & 255];
}
function rgba(c, a) { const [r,g,b] = rgb(c); return `rgba(${r},${g},${b},${a})`; }
function gauss() { let u = 0, v = 0; while (u === 0) u = Math.random(); v = Math.random(); return Math.sqrt(-2*Math.log(u)) * Math.cos(2*Math.PI*v); }
function erf(x) {
  const s = Math.sign(x); x = Math.abs(x);
  const t = 1 / (1 + 0.3275911 * x);
  const y = 1 - (((((1.061405429*t - 1.453152027)*t) + 1.421413741)*t - 0.284496736)*t + 0.254829592) * t * Math.exp(-x*x);
  return s * y;
}
function fit(c) {
  const r = c.getBoundingClientRect();
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const w = Math.max(1, r.width), h = Math.max(1, r.height);
  const W = Math.round(w*dpr), H = Math.round(h*dpr);
  if (c.width !== W || c.height !== H) { c.width = W; c.height = H; }
  const ctx = c.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);
  return { ctx, w, h };
}
const SUP = {'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
const pow10 = v => '10' + String(Math.round(Math.log10(v))).split('').map(c => SUP[c]).join('');

function frame(ctx, w, h, o) {
  const L = o.l ?? 52, R = o.r ?? 14, T = o.t ?? 14, B = o.b ?? 38;
  const bx = L, by = T, bw = Math.max(10, w-L-R), bh = Math.max(10, h-T-B);
  const tx = v => o.xlog ? Math.log10(v) : v, ty = v => o.ylog ? Math.log10(v) : v;
  const X = v => bx + (tx(v) - tx(o.x0)) / (tx(o.x1) - tx(o.x0)) * bw;
  const Y = v => by + bh - (ty(v) - ty(o.y0)) / (ty(o.y1) - ty(o.y0)) * bh;
  ctx.font = `11px ${MONO}`; ctx.lineWidth = 1;
  const grid = tok('--grid'), muted = tok('--muted');
  for (const v of (o.xt || [])) {
    const x = X(v); ctx.strokeStyle = grid; ctx.beginPath(); ctx.moveTo(x, by); ctx.lineTo(x, by+bh); ctx.stroke();
    ctx.fillStyle = muted; ctx.textAlign = 'center'; ctx.fillText(o.xf ? o.xf(v) : String(v), x, by+bh+15);
  }
  for (const v of (o.yt || [])) {
    const y = Y(v); ctx.strokeStyle = grid; ctx.beginPath(); ctx.moveTo(bx, y); ctx.lineTo(bx+bw, y); ctx.stroke();
    ctx.fillStyle = muted; ctx.textAlign = 'right'; ctx.fillText(o.yf ? o.yf(v) : String(v), bx-6, y+4);
  }
  ctx.strokeStyle = tok('--rule'); ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx, by+bh); ctx.lineTo(bx+bw, by+bh); ctx.stroke();
  ctx.fillStyle = muted; ctx.font = `12px ${DISP}`;
  if (o.xl) { ctx.textAlign = 'center'; ctx.fillText(o.xl, bx+bw/2, by+bh+31); }
  if (o.yl) { ctx.save(); ctx.translate(13, by+bh/2); ctx.rotate(-Math.PI/2); ctx.textAlign = 'center'; ctx.fillText(o.yl, 0, 0); ctx.restore(); }
  return { X, Y, bx, by, bw, bh };
}
function clipBox(ctx, f) { ctx.save(); ctx.beginPath(); ctx.rect(f.bx, f.by, f.bw, f.bh); ctx.clip(); }

/* ---------- Modulverwaltung ---------- */
const mods = [];
const io = new IntersectionObserver(es => es.forEach(e => { if (e.target._mod) e.target._mod.visible = e.isIntersecting; }), { rootMargin: '100px' });
function reg(m) { m.visible = true; m.el._mod = m; io.observe(m.el); mods.push(m); new ResizeObserver(() => m.draw()).observe(m.el); return m; }
function redrawAll() { mods.forEach(m => m.draw()); }
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', redrawAll);
new MutationObserver(redrawAll).observe(root, { attributes: true, attributeFilter: ['data-theme'] });
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  for (const m of mods) if (m.anim && m.playing && m.visible) { m.step(dt); m.draw(); }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
function playBtn(btn, m) {
  btn.addEventListener('click', () => { m.playing = !m.playing; btn.textContent = m.playing ? 'Pause' : 'Abspielen'; });
  if (!m.playing) btn.textContent = 'Abspielen';
}

/* ---------- Spektren & Schwächung ---------- */
const WATER = [[10,5.33],[15,1.67],[20,0.81],[30,0.376],[40,0.268],[50,0.227],[60,0.206],[80,0.184],[100,0.171],[150,0.150]];
const BONE  = [[10,28.5],[15,9.0],[20,4.0],[30,1.33],[40,0.665],[50,0.424],[60,0.315],[80,0.223],[100,0.186],[150,0.148]];
const AL    = [[10,26.2],[15,7.96],[20,3.44],[30,1.13],[40,0.568],[50,0.368],[60,0.278],[80,0.202],[100,0.170],[150,0.138]];
const I_LO  = [[10,162],[15,61],[20,22.1],[25,12.3],[30,8.6],[33.16,6.55]];
const I_HI  = [[33.17,36.0],[40,22.1],[50,12.3],[60,7.6],[80,3.5],[100,1.94],[150,0.73]];
function mu(t, E) {
  if (E <= t[0][0]) return t[0][1];
  for (let i = 0; i < t.length-1; i++) if (E <= t[i+1][0]) {
    const [e0,m0] = t[i], [e1,m1] = t[i+1];
    const f = Math.log(E/e0) / Math.log(e1/e0);
    return Math.exp(Math.log(m0) + f*Math.log(m1/m0));
  }
  return t[t.length-1][1];
}
const muI = E => E < 33.17 ? mu(I_LO, E) : mu(I_HI, E);
const EG = []; for (let e = 10; e <= 150.001; e += 0.5) EG.push(Math.round(e*10)/10);
function tube(kvp) {
  const g = (E, c) => Math.exp(-0.5*((E-c)/0.45)**2);
  return EG.map(E => {
    if (E >= kvp) return 0;
    let n = (kvp - E) / E;
    if (kvp > 69.5) { const a = 1.3*(kvp-69.5)/50; n += a*(g(E,59.3) + 0.55*g(E,58.0) + 0.32*g(E,67.2)); }
    return n * Math.exp(-mu(AL, E)*2.7*0.6);
  });
}
function transmit(spec, waterCm, iodMgCm2) {
  return spec.map((n, i) => { const E = EG[i]; return n * Math.exp(-mu(WATER, E)*waterCm - muI(E)*iodMgCm2/1000); });
}
function sampler(spec) {
  const cdf = []; let s = 0; for (const v of spec) { s += v; cdf.push(s); }
  return () => {
    const u = Math.random()*s; let lo = 0, hi = cdf.length-1;
    while (lo < hi) { const m = (lo+hi) >> 1; if (cdf[m] < u) lo = m+1; else hi = m; }
    return EG[lo] + (Math.random()-0.5)*0.5;
  };
}
const BINC = ['--bin0','--bin1','--bin2','--bin3'];

/* ---------- Abb. 5: Pulse ---------- */
(() => {
  const c = $('#cv-pulse'), ir = $('#pl-rate'), it = $('#pl-tp');
  const TH = [20,35,50,65];
  const samp = sampler(transmit(tube(120), 10, 0));
  class Sim {
    constructor(rate, tp, keep) { this.rate = rate; this.tp = tp; this.t = 0; this.next = this.arr(); this.pul = []; this.noise = 0; this.prev = 0; this.keep = keep;
      this.cnt = [0,0,0,0]; this.tru = [0,0,0,0]; this.nTrue = 0; this.buf = keep ? new Float32Array(keep) : null; this.bi = 0; this.marks = []; }
    arr() { return -Math.log(1 - Math.random()) / this.rate; }
    h(t) { const x = t/this.tp; return x * Math.exp(1 - x); }
    advance(ns) {
      const a = Math.exp(-1/Math.max(2, this.tp*0.5)), sq = Math.sqrt(1 - a*a);
      for (let k = 0; k < ns; k++) {
        while (this.next <= this.t) {
          const E = samp(); this.pul.push([this.next, E]); this.nTrue++;
          for (let j = 0; j < 4; j++) if (E >= TH[j]) this.tru[j]++;
          if (this.keep) this.marks.push([this.next, E]);
          this.next += this.arr();
        }
        let s = 0;
        for (const [t0, E] of this.pul) { const dt = this.t - t0; if (dt >= 0) s += E*this.h(dt); }
        this.noise = a*this.noise + sq*0.7*gauss();
        s += this.noise;
        for (let j = 0; j < 4; j++) if (this.prev < TH[j] && s >= TH[j]) this.cnt[j]++;
        this.prev = s;
        if (this.buf) { this.buf[this.bi % this.keep] = s; this.bi++; }
        this.t += 1;
        if (this.pul.length && this.t - this.pul[0][0] > 9*this.tp) this.pul = this.pul.filter(p => this.t - p[0] <= 9*this.tp);
      }
      if (this.keep) this.marks = this.marks.filter(mk => this.t - mk[0] <= this.keep);
    }
  }
  const WIN = 700;
  let vis, stat, acc = 0;
  const rate = () => Math.pow(10, +ir.value) * 1e-3; // Ereignisse pro ns
  function reset() {
    $('#pl-rate-o').textContent = `${nf(Math.pow(10, +ir.value), Math.pow(10, +ir.value) < 10 ? 1 : 0)} Mcps`;
    $('#pl-tp-o').textContent = `${it.value} ns`;
    vis = new Sim(rate(), +it.value, WIN); vis.advance(WIN);
    stat = new Sim(rate(), +it.value, 0);
    table();
  }
  function table() {
    const n = stat.nTrue;
    const rows = TH.map((T, j) => {
      const tr = stat.tru[j], cn = stat.cnt[j];
      const d = tr ? (cn/tr - 1)*100 : 0;
      return `<tr><td><span class="sw" style="background:var(${BINC[j]})"></span>≥ ${T} keV</td><td class="num">${nf(tr)}</td><td class="num">${nf(cn)}</td><td class="num">${tr ? (d >= 0 ? '+' : '') + nf(d,1) + ' %' : '–'}</td></tr>`;
    }).join('');
    $('#pl-table').innerHTML = `<thead><tr><th>Schwelle</th><th class="num">wahre Photonen</th><th class="num">gezählt</th><th class="num">Abweichung</th></tr></thead><tbody>${rows}</tbody><tfoot><tr><td colspan="4" class="muted" style="font-size:12px;border:0">Simulierte Zeit: ${nf(stat.t/1000,0)} µs · ${nf(n)} Photonen</td></tr></tfoot>`;
  }
  const m = reg({ el: c, anim: true, playing: !reduceMotion,
    step(dt) {
      vis.advance(Math.max(1, Math.round(dt*160)));
      if (stat.t < 4e6) { stat.advance(Math.round(dt*60000)); }
      acc += dt; if (acc > 0.3) { acc = 0; table(); }
    },
    draw() {
      const { ctx, w, h } = fit(c);
      const f = frame(ctx, w, h, { x0: 0, x1: WIN, y0: -5, y1: 140, xt: [0, 100, 200, 300, 400, 500, 600, 700], yt: [0, 20, 35, 50, 65, 100, 140].filter(v => !TH.includes(v)), xf: v => v, xl: 'Zeit (ns), Fenster scrollt', yl: 'Pulshöhe (keV)', b: 40 });
      clipBox(ctx, f);
      TH.forEach((T, j) => {
        ctx.strokeStyle = tok(BINC[j]); ctx.lineWidth = 1.2; ctx.setLineDash([6,4]);
        ctx.beginPath(); ctx.moveTo(f.bx, f.Y(T)); ctx.lineTo(f.bx+f.bw, f.Y(T)); ctx.stroke(); ctx.setLineDash([]);
        ctx.fillStyle = tok(BINC[j]); ctx.font = `11px ${MONO}`; ctx.textAlign = 'right'; ctx.fillText(`T${j+1} ${T}`, f.bx+f.bw-4, f.Y(T)-3);
      });
      const n = Math.min(vis.bi, WIN), start = vis.bi - n;
      ctx.strokeStyle = tok('--fg'); ctx.lineWidth = 1.5; ctx.beginPath();
      for (let k = 0; k < n; k++) { const v = vis.buf[(start + k) % WIN]; const x = f.X(WIN - n + k), y = f.Y(v); k ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
      ctx.stroke();
      const t0 = vis.t - WIN;
      for (const [ta, E] of vis.marks) {
        let b = -1; for (let j = 0; j < 4; j++) if (E >= TH[j]) b = j;
        ctx.fillStyle = b < 0 ? tok('--muted') : tok(BINC[b]);
        ctx.fillRect(f.X(ta - t0) - 1, f.by + f.bh - 10, 2.5, 10);
      }
      ctx.restore();
    }
  });
  ir.addEventListener('input', reset); it.addEventListener('input', reset);
  reset();
  playBtn($('#pl-play'), m);
  m.draw();
})();

})();
</script>
</body>
</html>
