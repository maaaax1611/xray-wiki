<style>

}

  --accent: #7d9cf2; --accent-soft: #1b2a4d; --elec: #5f95f0; --hole: #ef6b78;

.d-ste { stroke: var(--elec); fill: none; } .d-stb2 { stroke: var(--bin2); fill: none; }

<body>
<main class="widget">
<figure class="fig">
        <canvas id="cv-em" class="c-em" role="img" aria-label="Elektromagnetisches Spektrum auf logarithmischer Energieachse mit Regler; darunter eine Welle, deren Wellenlänge mit steigender Energie kürzer wird."></canvas>
        <div class="ctrls">
          <div class="ctrl"><div class="lab"><label for="em-e">Photonenenergie</label><output id="em-e-o"></output></div><input id="em-e" type="range" min="-6" max="6.6" step="0.01" value="4.78"></div>
        </div>
        <div class="readout" id="em-read"></div>
        <figcaption><b>Abb. 1</b> Das elektromagnetische Spektrum. Die Achse ist logarithmisch: Jeder Teilstrich bedeutet Faktor 1000. Unten die zugehörige Welle (Wellenlänge nicht maßstäblich, sie würde sonst über viele Größenordnungen variieren). Der markierte Bereich zeigt die Photonenenergien im CT.</figcaption>
      </figure>
</main>
<script>
(() => {

'use strict';
const $ = s => document.querySelector(s);
const root = document.documentElement;
const tok = n => getComputedStyle(root).getPropertyValue(n).trim();
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const MONO = '"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace';
const DISP = '"IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif';
const nf = (v, d = 0) => v.toLocaleString('de-DE', { minimumFractionDigits: d, maximumFractionDigits: d });
function rgb(c) { c = c.replace('#', ''); if (c.length === 3) c = c.split('').map(x => x + x).join(''); const v = parseInt(c, 16); return [v >> 16 & 255, v >> 8 & 255, v & 255]; }
function rgba(c, a) { const [r, g, b] = rgb(c); return `rgba(${r},${g},${b},${a})`; }
function gauss() { let u = 0; while (u === 0) u = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * Math.random()); }
function fit(c) {
  const r = c.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
  const w = Math.max(1, r.width), h = Math.max(1, r.height), W = Math.round(w * dpr), H = Math.round(h * dpr);
  if (c.width !== W || c.height !== H) { c.width = W; c.height = H; }
  const ctx = c.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, w, h);
  return { ctx, w, h };
}
const SUP = { '-': '⁻', '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹' };
function frame(ctx, x0px, y0px, w, h, o) {
  const L = o.l ?? 48, R = o.r ?? 12, T = o.t ?? 12, B = o.b ?? 36;
  const bx = x0px + L, by = y0px + T, bw = Math.max(10, w - L - R), bh = Math.max(10, h - T - B);
  const X = v => bx + (v - o.x0) / (o.x1 - o.x0) * bw;
  const Y = v => by + bh - (v - o.y0) / (o.y1 - o.y0) * bh;
  ctx.font = `11px ${MONO}`; ctx.lineWidth = 1;
  const grid = tok('--grid'), muted = tok('--muted');
  for (const v of (o.xt || [])) { const x = X(v); ctx.strokeStyle = grid; ctx.beginPath(); ctx.moveTo(x, by); ctx.lineTo(x, by + bh); ctx.stroke(); ctx.fillStyle = muted; ctx.textAlign = 'center'; ctx.fillText(o.xf ? o.xf(v) : String(v), x, by + bh + 15); }
  for (const v of (o.yt || [])) { const y = Y(v); ctx.strokeStyle = grid; ctx.beginPath(); ctx.moveTo(bx, y); ctx.lineTo(bx + bw, y); ctx.stroke(); ctx.fillStyle = muted; ctx.textAlign = 'right'; ctx.fillText(o.yf ? o.yf(v) : String(v), bx - 6, y + 4); }
  ctx.strokeStyle = tok('--rule'); ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx, by + bh); ctx.lineTo(bx + bw, by + bh); ctx.stroke();
  ctx.fillStyle = muted; ctx.font = `12px ${DISP}`;
  if (o.xl) { ctx.textAlign = 'center'; ctx.fillText(o.xl, bx + bw / 2, by + bh + 31); }
  if (o.yl) { ctx.save(); ctx.translate(x0px + 12, by + bh / 2); ctx.rotate(-Math.PI / 2); ctx.textAlign = 'center'; ctx.fillText(o.yl, 0, 0); ctx.restore(); }
  return { X, Y, bx, by, bw, bh };
}
function clipBox(ctx, f) { ctx.save(); ctx.beginPath(); ctx.rect(f.bx, f.by, f.bw, f.bh); ctx.clip(); }
const BINC = ['--bin0', '--bin1', '--bin2', '--bin3'];

const mods = [];
const io = new IntersectionObserver(es => es.forEach(e => { if (e.target._mod) e.target._mod.visible = e.isIntersecting; }), { rootMargin: '100px' });
function reg(m) { m.visible = true; m.el._mod = m; io.observe(m.el); mods.push(m); new ResizeObserver(() => m.draw()).observe(m.el); return m; }
const redrawAll = () => mods.forEach(m => m.draw());
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', redrawAll);
new MutationObserver(redrawAll).observe(root, { attributes: true, attributeFilter: ['data-theme'] });
let last = performance.now();
function loop(now) { const dt = Math.min(0.05, (now - last) / 1000); last = now; for (const m of mods) if (m.anim && m.playing && m.visible) { m.step(dt); m.draw(); } requestAnimationFrame(loop); }
requestAnimationFrame(loop);
function playBtn(btn, m) { btn.addEventListener('click', () => { m.playing = !m.playing; btn.textContent = m.playing ? 'Pause' : 'Abspielen'; }); if (!m.playing) btn.textContent = 'Abspielen'; }

/* Schwächungsdaten (cm²/g), genähert nach NIST XCOM */
const WATER = [[10,5.33],[15,1.67],[20,0.81],[30,0.376],[40,0.268],[50,0.227],[60,0.206],[80,0.184],[100,0.171],[150,0.150]];
const BONE  = [[10,28.5],[15,9.0],[20,4.0],[30,1.33],[40,0.665],[50,0.424],[60,0.315],[80,0.223],[100,0.186],[150,0.148]];
const AL    = [[10,26.2],[15,7.96],[20,3.44],[30,1.13],[40,0.568],[50,0.368],[60,0.278],[80,0.202],[100,0.170],[150,0.138]];
function mu(t, E) {
  if (E <= t[0][0]) return t[0][1];
  for (let i = 0; i < t.length - 1; i++) if (E <= t[i + 1][0]) { const [e0, m0] = t[i], [e1, m1] = t[i + 1]; const f = Math.log(E / e0) / Math.log(e1 / e0); return Math.exp(Math.log(m0) + f * Math.log(m1 / m0)); }
  return t[t.length - 1][1];
}
function kleinNishina(EkeV) { // cm² pro Elektron
  const k = EkeV / 511, re2 = 7.9407e-26, l = Math.log(1 + 2 * k);
  return 2 * Math.PI * re2 * ((1 + k) / (k * k) * (2 * (1 + k) / (1 + 2 * k) - l / k) + l / (2 * k) - (1 + 3 * k) / ((1 + 2 * k) ** 2));
}
const EG = []; for (let e = 10; e <= 150.001; e += 0.5) EG.push(Math.round(e * 10) / 10);
function tube(kvp, alMm) {
  const g = (E, c) => Math.exp(-0.5 * ((E - c) / 0.45) ** 2);
  return EG.map(E => {
    if (E >= kvp) return 0;
    let n = (kvp - E) / E;
    if (kvp > 69.5) { const a = 1.3 * (kvp - 69.5) / 50; n += a * (g(E, 59.3) + 0.55 * g(E, 58.0) + 0.32 * g(E, 67.2)); }
    return n * Math.exp(-mu(AL, E) * 2.7 * (1 + alMm) / 10);
  });
}
function sampler(spec) {
  const cdf = []; let s = 0; for (const v of spec) { s += v; cdf.push(s); }
  return () => { const u = Math.random() * s; let lo = 0, hi = cdf.length - 1; while (lo < hi) { const m = (lo + hi) >> 1; if (cdf[m] < u) lo = m + 1; else hi = m; } return EG[lo] + (Math.random() - 0.5) * 0.5; };
}
const ebin = E => E < 40 ? 0 : E < 60 ? 1 : E < 80 ? 2 : 3;

/* ---------- Abb. 1: EM-Spektrum ---------- */
(() => {
  const c = $('#cv-em'), s = $('#em-e');
  const REG = [['Radio', -9, -5], ['Mikrowellen', -5, -3], ['Infrarot', -3, 0.2175], ['Licht', 0.2175, 0.4914], ['UV', 0.4914, 2], ['Röntgen', 2, 5.3], ['Gamma', 5.3, 9]];
  const X0 = -7, X1 = 7.5;
  let phase = 0;
  const pick = (v, units) => { for (const [f, n] of units) if (v >= f) { const x = v / f; return nf(x, x < 10 ? 2 : x < 100 ? 1 : 0) + ' ' + n; } const [f, n] = units[units.length - 1]; return nf(v / f, 2) + ' ' + n; };
  const fmtE = e => pick(e, [[1e6, 'MeV'], [1e3, 'keV'], [1, 'eV'], [1e-3, 'meV'], [1e-6, 'µeV'], [1e-9, 'neV']]);
  const fmtL = m => pick(m, [[1e3, 'km'], [1, 'm'], [1e-2, 'cm'], [1e-3, 'mm'], [1e-6, 'µm'], [1e-9, 'nm'], [1e-12, 'pm'], [1e-15, 'fm']]);
  const fmtF = f => pick(f, [[1e21, 'ZHz'], [1e18, 'EHz'], [1e15, 'PHz'], [1e12, 'THz'], [1e9, 'GHz'], [1e6, 'MHz'], [1e3, 'kHz'], [1, 'Hz']]);
  function visRGB(nm) {
    let r = 0, g = 0, b = 0;
    if (nm < 440) { r = (440 - nm) / 60; b = 1; } else if (nm < 490) { g = (nm - 440) / 50; b = 1; } else if (nm < 510) { g = 1; b = (510 - nm) / 20; }
    else if (nm < 580) { r = (nm - 510) / 70; g = 1; } else if (nm < 645) { r = 1; g = (645 - nm) / 65; } else r = 1;
    return `rgb(${Math.round(r * 230)},${Math.round(g * 230)},${Math.round(b * 230)})`;
  }
  function region(le) { for (const r of REG) if (le >= r[1] && le < r[2]) return r[0]; return 'Gamma'; }
  function update() {
    const le = +s.value, E = Math.pow(10, le), lam = 1.23984e-6 / E, f = E / 4.135667e-15;
    $('#em-e-o').textContent = fmtE(E);
    const ratio = E / 2.3;
    $('#em-read').innerHTML = `<span class="k">Bereich:</span> ${region(le)}  <span class="k">·</span>  <span class="k">Wellenlänge:</span> ${fmtL(lam)}  <span class="k">·</span>  <span class="k">Frequenz:</span> ${fmtF(f)}<br><span class="k">Energie relativ zu grünem Licht (2,3 eV):</span> ${ratio >= 1 ? nf(ratio, ratio < 10 ? 1 : 0) + '-mal so viel' : '1/' + nf(1 / ratio, 1 / ratio < 10 ? 1 : 0)}`;
    m.draw();
  }
  const m = reg({ el: c, anim: true, playing: !reduceMotion,
    step(dt) { phase += dt * 2.2; },
    draw() {
      const { ctx, w, h } = fit(c);
      const fg = tok('--fg'), mut = tok('--muted'), rule = tok('--rule');
      const L = 8, R = 8, bw = w - L - R, X = v => L + (v - X0) / (X1 - X0) * bw;
      const by = 26, bh = Math.min(42, h * 0.22);
      REG.forEach((r, k) => {
        const a = X(Math.max(X0, r[1])), b = X(Math.min(X1, r[2]));
        if (r[0] === 'Licht') {
          const gr = ctx.createLinearGradient(a, 0, b, 0);
          ['#c33', '#e80', '#dc2', '#3a4', '#28c', '#83c'].forEach((cc, i) => gr.addColorStop(i / 5, cc));
          ctx.fillStyle = gr;
        } else ctx.fillStyle = k % 2 ? tok('--grid') : tok('--accent-soft');
        ctx.fillRect(a, by, b - a, bh);
        ctx.font = `12px ${DISP}`; ctx.fillStyle = fg; ctx.textAlign = 'center';
        const tw = ctx.measureText(r[0]).width;
        if (r[0] !== 'Licht' && b - a > tw + 6) ctx.fillText(r[0], (a + b) / 2, by + bh / 2 + 4);
      });
      ctx.font = `11px ${DISP}`; ctx.fillStyle = mut; ctx.textAlign = 'center';
      ctx.fillText('Licht', (X(0.2175) + X(0.4914)) / 2, by - 6);
      // Achse
      ctx.strokeStyle = rule; ctx.beginPath(); ctx.moveTo(L, by + bh); ctx.lineTo(L + bw, by + bh); ctx.stroke();
      ctx.font = `10.5px ${MONO}`; ctx.fillStyle = mut;
      const ticks = [[-6, '1 µeV'], [-3, '1 meV'], [0, '1 eV'], [3, '1 keV'], [6, '1 MeV']];
      ticks.forEach(([v, t]) => { const x = X(v); ctx.fillRect(x, by + bh, 1, 5); ctx.fillText(t, x, by + bh + 17); });
      // CT-Bereich
      const a = X(Math.log10(20000)), b = X(Math.log10(140000));
      ctx.fillStyle = tok('--accent'); ctx.fillRect(a, by - 4, b - a, 4);
      ctx.font = `600 11px ${DISP}`; ctx.textAlign = 'center'; ctx.fillText('CT', (a + b) / 2, by - 7);
      // Marker
      const le = +s.value, mx = X(le);
      ctx.strokeStyle = fg; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(mx, by - 2); ctx.lineTo(mx, by + bh + 2); ctx.stroke();
      ctx.fillStyle = fg; ctx.beginPath(); ctx.moveTo(mx - 6, by + bh + 26); ctx.lineTo(mx + 6, by + bh + 26); ctx.lineTo(mx, by + bh + 18); ctx.fill();
      // Welle
      const wy0 = by + bh + 34, wh = h - wy0 - 6, cy = wy0 + wh / 2, amp = Math.min(28, wh * 0.38);
      const Lpx = Math.max(7, 300 * Math.pow(10, -(le + 6) / 12.6 * 1.65));
      const E = Math.pow(10, le), nm = 1239.84 / E;
      ctx.strokeStyle = (nm >= 380 && nm <= 750) ? visRGB(nm) : tok('--accent');
      ctx.lineWidth = 2; ctx.beginPath();
      for (let x = L; x <= L + bw; x += 1) { const y = cy + amp * Math.sin(2 * Math.PI * (x / Lpx) - phase * Math.min(6, 200 / Lpx)); x === L ? ctx.moveTo(x, y) : ctx.lineTo(x, y); }
      ctx.stroke();
      ctx.lineWidth = 1;
    }
  });
  s.addEventListener('input', update);
  update();
})();

})();
