<body>
<main class="widget">
<figure class="fig">
        <canvas id="cv-drift" class="c-drift" role="img" aria-label="Animation: ein Photon erzeugt Ladungen in einem Sensor. Elektronen driften schnell zur Anode, Löcher langsam zur Kathode, einige bleiben stecken. Daneben wächst das gemessene Signal über der Zeit."></canvas>
        <div class="ctrls">
          <div class="ctrl"><div class="lab"><label for="dr-u">Spannung</label><output id="dr-u-o"></output></div><input id="dr-u" type="range" min="100" max="1500" step="50" value="1000"></div>
          <div class="ctrl"><div class="lab"><label for="dr-x">Tiefe ab Kathode</label><output id="dr-x-o"></output></div><input id="dr-x" type="range" min="0.05" max="0.95" step="0.01" value="0.4"></div>
          <div class="ctrl"><div class="lab"><label for="dr-mt">μτ Löcher</label><output id="dr-mt-o"></output></div><input id="dr-mt" type="range" min="-6" max="-3" step="0.05" value="-4"></div>
          <button class="btn" type="button" id="dr-go">Neues Photon</button>
        </div>
        <div class="readout" id="dr-read"></div>
        <figcaption><b>Abb. 7</b> Links: Querschnitt durch einen 1,6 mm dicken CdTe-Sensor. Elektronen (blau) driften nach unten zur Anode, Löcher (rot) nach oben zur Kathode, gekreuzte Punkte sind eingefangen. Die Zeit läuft stark verlangsamt. Rechts das Signal an der Elektrode über der Zeit, aufgeteilt nach Elektronen- und Löcherbeitrag. Wie das Signal entsteht, erklärt Baustein 6.</figcaption>
      </figure>
</main>
<script>
(() => {

'use strict';
const $ = s => document.querySelector(s);
const root = document.documentElement;
const tok = n => getComputedStyle(root).getPropertyValue(n).trim();
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const MONO = '"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace';
const DISP = '"IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif';
const nf = (v, d = 0) => v.toLocaleString('de-DE', { minimumFractionDigits: d, maximumFractionDigits: d });
function rgb(c) { c = c.replace('#', ''); if (c.length === 3) c = c.split('').map(x => x + x).join(''); const v = parseInt(c, 16); return [v >> 16 & 255, v >> 8 & 255, v & 255]; }
function rgba(c, a) { const [r, g, b] = rgb(c); return `rgba(${r},${g},${b},${a})`; }
function gauss() { let u = 0; while (u === 0) u = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * Math.random()); }
function fit(c) {
  const r = c.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
  const w = Math.max(1, r.width), h = Math.max(1, r.height), W = Math.round(w * dpr), H = Math.round(h * dpr);
  if (c.width !== W || c.height !== H) { c.width = W; c.height = H; }
  const ctx = c.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, w, h);
  return { ctx, w, h };
}
const SUP = { '-': '⁻', '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹' };
function frame(ctx, x0px, y0px, w, h, o) {
  const L = o.l ?? 48, R = o.r ?? 12, T = o.t ?? 12, B = o.b ?? 36;
  const bx = x0px + L, by = y0px + T, bw = Math.max(10, w - L - R), bh = Math.max(10, h - T - B);
  const X = v => bx + (v - o.x0) / (o.x1 - o.x0) * bw;
  const Y = v => by + bh - (v - o.y0) / (o.y1 - o.y0) * bh;
  ctx.font = `11px ${MONO}`; ctx.lineWidth = 1;
  const grid = tok('--grid'), muted = tok('--muted');
  for (const v of (o.xt || [])) { const x = X(v); ctx.strokeStyle = grid; ctx.beginPath(); ctx.moveTo(x, by); ctx.lineTo(x, by + bh); ctx.stroke(); ctx.fillStyle = muted; ctx.textAlign = 'center'; ctx.fillText(o.xf ? o.xf(v) : String(v), x, by + bh + 15); }
  for (const v of (o.yt || [])) { const y = Y(v); ctx.strokeStyle = grid; ctx.beginPath(); ctx.moveTo(bx, y); ctx.lineTo(bx + bw, y); ctx.stroke(); ctx.fillStyle = muted; ctx.textAlign = 'right'; ctx.fillText(o.yf ? o.yf(v) : String(v), bx - 6, y + 4); }
  ctx.strokeStyle = tok('--rule'); ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx, by + bh); ctx.lineTo(bx + bw, by + bh); ctx.stroke();
  ctx.fillStyle = muted; ctx.font = `12px ${DISP}`;
  if (o.xl) { ctx.textAlign = 'center'; ctx.fillText(o.xl, bx + bw / 2, by + bh + 31); }
  if (o.yl) { ctx.save(); ctx.translate(x0px + 12, by + bh / 2); ctx.rotate(-Math.PI / 2); ctx.textAlign = 'center'; ctx.fillText(o.yl, 0, 0); ctx.restore(); }
  return { X, Y, bx, by, bw, bh };
}
function clipBox(ctx, f) { ctx.save(); ctx.beginPath(); ctx.rect(f.bx, f.by, f.bw, f.bh); ctx.clip(); }
const BINC = ['--bin0', '--bin1', '--bin2', '--bin3'];

const mods = [];
const io = new IntersectionObserver(es => es.forEach(e => { if (e.target._mod) e.target._mod.visible = e.isIntersecting; }), { rootMargin: '100px' });
function reg(m) { m.visible = true; m.el._mod = m; io.observe(m.el); mods.push(m); new ResizeObserver(() => m.draw()).observe(m.el); return m; }
const redrawAll = () => mods.forEach(m => m.draw());
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', redrawAll);
new MutationObserver(redrawAll).observe(root, { attributes: true, attributeFilter: ['data-theme'] });
let last = performance.now();
function loop(now) { const dt = Math.min(0.05, (now - last) / 1000); last = now; for (const m of mods) if (m.anim && m.playing && m.visible) { m.step(dt); m.draw(); } requestAnimationFrame(loop); }
requestAnimationFrame(loop);
function playBtn(btn, m) { btn.addEventListener('click', () => { m.playing = !m.playing; btn.textContent = m.playing ? 'Pause' : 'Abspielen'; }); if (!m.playing) btn.textContent = 'Abspielen'; }

/* Schwächungsdaten (cm²/g), genähert nach NIST XCOM */
const WATER = [[10,5.33],[15,1.67],[20,0.81],[30,0.376],[40,0.268],[50,0.227],[60,0.206],[80,0.184],[100,0.171],[150,0.150]];
const BONE  = [[10,28.5],[15,9.0],[20,4.0],[30,1.33],[40,0.665],[50,0.424],[60,0.315],[80,0.223],[100,0.186],[150,0.148]];
const AL    = [[10,26.2],[15,7.96],[20,3.44],[30,1.13],[40,0.568],[50,0.368],[60,0.278],[80,0.202],[100,0.170],[150,0.138]];
function mu(t, E) {
  if (E <= t[0][0]) return t[0][1];
  for (let i = 0; i < t.length - 1; i++) if (E <= t[i + 1][0]) { const [e0, m0] = t[i], [e1, m1] = t[i + 1]; const f = Math.log(E / e0) / Math.log(e1 / e0); return Math.exp(Math.log(m0) + f * Math.log(m1 / m0)); }
  return t[t.length - 1][1];
}
function kleinNishina(EkeV) { // cm² pro Elektron
  const k = EkeV / 511, re2 = 7.9407e-26, l = Math.log(1 + 2 * k);
  return 2 * Math.PI * re2 * ((1 + k) / (k * k) * (2 * (1 + k) / (1 + 2 * k) - l / k) + l / (2 * k) - (1 + 3 * k) / ((1 + 2 * k) ** 2));
}
const EG = []; for (let e = 10; e <= 150.001; e += 0.5) EG.push(Math.round(e * 10) / 10);
function tube(kvp, alMm) {
  const g = (E, c) => Math.exp(-0.5 * ((E - c) / 0.45) ** 2);
  return EG.map(E => {
    if (E >= kvp) return 0;
    let n = (kvp - E) / E;
    if (kvp > 69.5) { const a = 1.3 * (kvp - 69.5) / 50; n += a * (g(E, 59.3) + 0.55 * g(E, 58.0) + 0.32 * g(E, 67.2)); }
    return n * Math.exp(-mu(AL, E) * 2.7 * (1 + alMm) / 10);
  });
}
function sampler(spec) {
  const cdf = []; let s = 0; for (const v of spec) { s += v; cdf.push(s); }
  return () => { const u = Math.random() * s; let lo = 0, hi = cdf.length - 1; while (lo < hi) { const m = (lo + hi) >> 1; if (cdf[m] < u) lo = m + 1; else hi = m; } return EG[lo] + (Math.random() - 0.5) * 0.5; };
}
const ebin = E => E < 40 ? 0 : E < 60 ? 1 : E < 80 ? 2 : 3;

/* ---------- Abb. 7: Drift ---------- */
(() => {
  const c = $('#cv-drift'), iu = $('#dr-u'), ix = $('#dr-x'), imt = $('#dr-mt');
  const D = 0.16, MUE = 1100, MUH = 100, MTE = 3e-3, NC = 40;
  let S = null, wait = 0, hold = false;
  function P() { const U = +iu.value, mt = Math.pow(10, +imt.value); return { U, z0: +ix.value, mt, ve: MUE * U / (D * D) * 1e-9, vh: MUH * U / (D * D) * 1e-9, te: MTE / MUE * 1e9, th: mt / MUH * 1e9 }; }
  function start() {
    const q = P();
    const tH = 1 / q.vh, tE = 1 / q.ve;
    const horizon = Math.max(3 * tE, Math.min(tH * 1.1, 6 * q.th + tE));
    S = { q, t: 0, T: horizon, speed: horizon / 4.2, intro: 0, e: [], h: [], Qe: 0, Qh: 0, rec: [[0, 0, 0]] };
    for (let i = 0; i < NC; i++) { const off = gauss() * 0.02; S.e.push({ z: q.z0, x: off, st: 0 }); S.h.push({ z: q.z0, x: gauss() * 0.02, st: 0 }); }
    wait = 0; hold = false;
    const lh = q.mt * q.U / D * 10;
    $('#dr-u-o').textContent = `${q.U} V`; $('#dr-x-o').textContent = `${nf(q.z0 * 1.6, 2)} mm`;
    const ex = Math.floor(+imt.value), man = Math.pow(10, +imt.value - ex);
    $('#dr-mt-o').textContent = `${nf(man, 1)}·10${String(ex).split('').map(ch => SUP[ch]).join('')} cm²/V`;
    S.readBase = `<span class="k">Feld:</span> ${nf(q.U / D, 0)} V/cm  <span class="k">·</span>  <span class="k">v_e:</span> ${nf(q.ve * 1600, 1)} µm/ns  <span class="k">·</span>  <span class="k">v_h:</span> ${nf(q.vh * 1600, 2)} µm/ns<br><span class="k">Laufzeit über 1,6 mm:</span> Elektronen ${nf(tE, 0)} ns, Löcher ${nf(tH, 0)} ns  <span class="k">·</span>  <span class="k">Driftlänge Löcher λ_h:</span> ${lh >= 10 ? nf(lh / 10, 1) + ' cm' : nf(lh, 2) + ' mm'}`;
    read();
  }
  function read() { $('#dr-read').innerHTML = S.readBase + `<br><span class="k">Signal bisher:</span> ${nf((S.Qe + S.Qh) * 100, 1)} %  (Elektronen ${nf(S.Qe * 100, 1)} %, Löcher ${nf(S.Qh * 100, 1)} %)`; }
  const m = reg({ el: c, anim: true, playing: !reduceMotion,
    step(dt) {
      if (!S) return;
      if (S.intro < 1) { S.intro += dt / 0.35; return; }
      if (hold) { wait += dt; if (wait > 2) start(); return; }
      const q = S.q, sub = 6, ds = dt * S.speed / sub;
      for (let k = 0; k < sub; k++) {
        if (S.t >= S.T) break;
        for (const c of S.e) if (c.st === 0) { if (Math.random() < ds / q.te) { c.st = 2; continue; } const nz = Math.min(1, c.z + q.ve * ds); S.Qe += (nz - c.z) / NC; c.z = nz; c.x += gauss() * 0.002; if (c.z >= 1) c.st = 1; }
        for (const c of S.h) if (c.st === 0) { if (Math.random() < ds / q.th) { c.st = 2; continue; } const nz = Math.max(0, c.z - q.vh * ds); S.Qh += (c.z - nz) / NC; c.z = nz; c.x += gauss() * 0.0007; if (c.z <= 0) c.st = 1; }
        S.t += ds;
        S.rec.push([S.t, S.Qe, S.Qh]);
      }
      const active = S.e.some(c => c.st === 0) || S.h.some(c => c.st === 0);
      if (!active || S.t >= S.T) hold = true;
      read();
    },
    draw() {
      if (!S) return;
      const { ctx, w, h } = fit(c);
      const narrow = w < 560;
      const A = narrow ? [0, 0, w, h * 0.48] : [0, 0, w * 0.42, h];
      const Pp = narrow ? [0, h * 0.5, w, h * 0.5] : [w * 0.45, 0, w * 0.55, h];
      const fg = tok('--fg'), mut = tok('--muted');
      const sx = A[0] + 30, sw = A[2] - 60, sy = A[1] + 26, sh = A[3] - 52;
      ctx.fillStyle = tok('--accent-soft'); ctx.fillRect(sx, sy, sw, sh);
      ctx.fillStyle = fg; ctx.fillRect(sx, sy - 5, sw, 5); ctx.fillRect(sx, sy + sh, sw, 5);
      ctx.font = `12px ${DISP}`; ctx.textAlign = 'left'; ctx.fillStyle = fg;
      ctx.fillText('Kathode  −', sx, sy - 10); ctx.fillText('Anode  +', sx, sy + sh + 19);
      ctx.fillStyle = mut; ctx.textAlign = 'right'; ctx.fillText('CdTe 1,6 mm', sx + sw, sy - 10);
      // Feldpfeile (Kraft auf Elektronen)
      ctx.strokeStyle = rgba(mut, 0.35); ctx.lineWidth = 1;
      for (let k = 1; k <= 4; k++) { const x = sx + sw * k / 5; ctx.beginPath(); ctx.moveTo(x, sy + 8); ctx.lineTo(x, sy + sh - 8); ctx.stroke(); }
      const zY = z => sy + z * sh, xX = x => sx + sw / 2 + x * sw;
      // Photon
      const q = S.q;
      if (S.intro < 1) { const y = sy - 20 + (zY(q.z0) - sy + 20) * S.intro; ctx.strokeStyle = tok('--bin2'); ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(xX(0), sy - 24); ctx.lineTo(xX(0), y); ctx.stroke(); }
      else { ctx.strokeStyle = rgba(tok('--bin2'), 0.35); ctx.lineWidth = 1.5; ctx.setLineDash([3, 3]); ctx.beginPath(); ctx.moveTo(xX(0), sy - 24); ctx.lineTo(xX(0), zY(q.z0)); ctx.stroke(); ctx.setLineDash([]); }
      const dot = (cc, col) => {
        const x = xX(cc.x), y = zY(cc.z);
        if (cc.st === 2) { ctx.strokeStyle = rgba(col, 0.55); ctx.lineWidth = 1.3; ctx.beginPath(); ctx.moveTo(x - 3, y - 3); ctx.lineTo(x + 3, y + 3); ctx.moveTo(x + 3, y - 3); ctx.lineTo(x - 3, y + 3); ctx.stroke(); }
        else { ctx.fillStyle = cc.st === 1 ? rgba(col, 0.35) : col; ctx.beginPath(); ctx.arc(x, y, 2.8, 0, 7); ctx.fill(); }
      };
      if (S.intro >= 1) { S.h.forEach(cc => dot(cc, tok('--hole'))); S.e.forEach(cc => dot(cc, tok('--elec'))); }
      // Signal
      const f = frame(ctx, Pp[0], Pp[1], Pp[2], Pp[3], { x0: 0, x1: S.T, y0: 0, y1: 1.05, xt: niceTicks(S.T), yt: [0, 0.25, 0.5, 0.75, 1], yf: v => nf(v * 100, 0) + '%', xl: 'Zeit (ns)', yl: 'Signal (Anteil der Ladung)', l: 50, t: 12 });
      clipBox(ctx, f);
      const line = (fn, col, lw, dash) => { ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.setLineDash(dash || []); ctx.beginPath(); S.rec.forEach((r, i) => { const x = f.X(r[0]), y = f.Y(fn(r)); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); ctx.stroke(); ctx.setLineDash([]); };
      line(r => r[1], tok('--elec'), 1.5, [5, 3]); line(r => r[2], tok('--hole'), 1.5, [5, 3]); line(r => r[1] + r[2], fg, 2.4);
      ctx.restore();
      ctx.font = `11px ${MONO}`; ctx.textAlign = 'left';
      const lx = f.bx + 8; let ly = f.by + 12;
      [['Summe', fg], ['Elektronen', tok('--elec')], ['Löcher', tok('--hole')]].forEach(([t, cc]) => { ctx.fillStyle = cc; ctx.fillRect(lx, ly - 6, 12, 2.5); ctx.fillStyle = mut; ctx.fillText(t, lx + 17, ly - 2); ly += 15; });
    }
  });
  function niceTicks(T) { const st = [1, 2, 5, 10, 20, 50, 100, 200, 500, 1000, 2000, 5000, 10000].find(s => T / s <= 5) || 20000; const a = []; for (let v = 0; v <= T + 1e-9; v += st) a.push(v); return a; }
  [iu, ix, imt].forEach(e => e.addEventListener('input', () => { start(); m.draw(); }));
  $('#dr-go').addEventListener('click', () => { start(); m.draw(); });
  start();
  if (reduceMotion) { S.intro = 1; for (let i = 0; i < 400 && !hold; i++) m.step(0.03); }
  m.draw();
})();

})();
</script>
</body>
</html>
