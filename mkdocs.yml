site_name: xray-wiki
site_url: https://maaaax1611.github.io/xray-wiki/
repo_url: https://github.com/maaaax1611/xray-wiki
edit_uri: edit/main/docs/
docs_dir: docs
use_directory_urls: false
theme:
  name: material
  language: de
  font:
    text: Source Serif 4
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: { icon: material/weather-night, name: Dunkel }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/weather-sunny, name: Hell }
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.follow
    - search.highlight
    - content.action.edit
plugins:
  - search: { lang: de }
  - callouts
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: { permalink: true }
  - pymdownx.arithmatex: { generic: true }
  - pymdownx.details
  - pymdownx.superfences
extra_css:
  - stylesheets/wiki.css
extra_javascript:
  - javascripts/wiki.js
  - javascripts/mathjax-config.js
  - https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.min.js
nav:
  - Start: index.md
  - Grundlagen:
      - E-Technik kompakt: grundlagen/e-technik.html
      - Lineare Algebra: grundlagen/lineare-algebra.md
  - Physik:
      - Vom Photon zum Bild: physik/roentgen.html
      - Vom Sinogramm zum Schnittbild: physik/rekonstruktion.html
      - Photonen zählen im CT: physik/photon-counting.html
  - Widgets: widgets.md
exclude_docs: |
  manifest.json
