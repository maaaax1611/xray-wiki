<style>
/* Layout: lange Lektüre-Spalte mit klebrigem Inhaltsverzeichnis links; Abbildungen als "Messplätze" in der Spalte. Tiefe = Ebene 1–5. */

}

  --accent: #7d9cf2; --accent-soft: #1b2a4d; --elec: #5f95f0; --hole: #ef6b78;

}

.d-e { fill: var(--elec); } .d-h { fill: var(--hole); }

<main class="widget">
<figure class="fig">
        <div class="two mc">
          <canvas id="cv-grid" class="c-grid" role="img" aria-label="Draufsicht auf 5 mal 5 Pixel mit simulierten Photoneneinschlägen, Ladungswolken und Fluoreszenzphotonen."></canvas>
          <canvas id="cv-hist" class="c-hist" role="img" aria-label="Gemessenes Spektrum aller Pixelereignisse für monoenergetische Einstrahlung, mit Photopeak, Escape-Peaks und Fluoreszenzpeaks."></canvas>
        </div>

          <div class="ctrl"><div class="lab"><label for="mc-p">Pixelgröße</label><output id="mc-p-o"></output></div><input id="mc-p" type="range" min="50" max="500" step="5" value="225"></div>
          <div class="ctrl"><div class="lab"><label for="mc-s">Wolkenbreite σ</label><output id="mc-s-o"></output></div><input id="mc-s" type="range" min="2" max="40" step="1" value="15"></div>
          <div class="ctrl"><div class="lab"><label for="mc-t">Zählschwelle</label><output id="mc-t-o"></output></div><input id="mc-t" type="range" min="8" max="50" step="1" value="20"></div>
          <label class="chk"><input id="mc-cs" type="checkbox"> Charge Summing</label>

        </div>
        <div class="readout" id="mc-read"></div>
        <figcaption><b>Abb. 7</b> Monte-Carlo-Simulation: Photonen treffen zufällig auf das mittlere Pixel. Fluoreszenz wird isotrop mit exponentieller Weglänge emittiert (Cd Kα: 115 µm, Te Kα: 60 µm), Ladung als 2D-Gauß verteilt, 1 keV Rauschen pro Pixel. Das Histogramm enthält alle Pixelereignisse über 5 keV. Vereinfachungen: keine Compton-Streuung, kein Entweichen von Fluoreszenz aus der Sensoroberfläche, keine Tiefenabhängigkeit.</figcaption>
      </figure>
</main>
<script>
(() => {

'use strict';
const $ = s => document.querySelector(s);
const root = document.documentElement;
const tok = n => getComputedStyle(root).getPropertyValue(n).trim();
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const MONO = '"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace';
const DISP = '"IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif';
const nf = (v, d=0) => v.toLocaleString('de-DE', {minimumFractionDigits:d, maximumFractionDigits:d});

function rgb(c) {
  c = c.replace('#','');
  if (c.length === 3) c = c.split('').map(x => x + x).join('');
  const v = parseInt(c, 16); return [v >> 16 & 255, v >> 8 & 255, v & 255];
}
function rgba(c, a) { const [r,g,b] = rgb(c); return `rgba(${r},${g},${b},${a})`; }
function gauss() { let u = 0, v = 0; while (u === 0) u = Math.random(); v = Math.random(); return Math.sqrt(-2*Math.log(u)) * Math.cos(2*Math.PI*v); }
function erf(x) {
  const s = Math.sign(x); x = Math.abs(x);
  const t = 1 / (1 + 0.3275911 * x);
  const y = 1 - (((((1.061405429*t - 1.453152027)*t) + 1.421413741)*t - 0.284496736)*t + 0.254829592) * t * Math.exp(-x*x);
  return s * y;
}
function fit(c) {
  const r = c.getBoundingClientRect();
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const w = Math.max(1, r.width), h = Math.max(1, r.height);
  const W = Math.round(w*dpr), H = Math.round(h*dpr);
  if (c.width !== W || c.height !== H) { c.width = W; c.height = H; }
  const ctx = c.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);
  return { ctx, w, h };
}
const SUP = {'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
const pow10 = v => '10' + String(Math.round(Math.log10(v))).split('').map(c => SUP[c]).join('');

function frame(ctx, w, h, o) {
  const L = o.l ?? 52, R = o.r ?? 14, T = o.t ?? 14, B = o.b ?? 38;
  const bx = L, by = T, bw = Math.max(10, w-L-R), bh = Math.max(10, h-T-B);
  const tx = v => o.xlog ? Math.log10(v) : v, ty = v => o.ylog ? Math.log10(v) : v;
  const X = v => bx + (tx(v) - tx(o.x0)) / (tx(o.x1) - tx(o.x0)) * bw;
  const Y = v => by + bh - (ty(v) - ty(o.y0)) / (ty(o.y1) - ty(o.y0)) * bh;
  ctx.font = `11px ${MONO}`; ctx.lineWidth = 1;
  const grid = tok('--grid'), muted = tok('--muted');
  for (const v of (o.xt || [])) {
    const x = X(v); ctx.strokeStyle = grid; ctx.beginPath(); ctx.moveTo(x, by); ctx.lineTo(x, by+bh); ctx.stroke();
    ctx.fillStyle = muted; ctx.textAlign = 'center'; ctx.fillText(o.xf ? o.xf(v) : String(v), x, by+bh+15);
  }
  for (const v of (o.yt || [])) {
    const y = Y(v); ctx.strokeStyle = grid; ctx.beginPath(); ctx.moveTo(bx, y); ctx.lineTo(bx+bw, y); ctx.stroke();
    ctx.fillStyle = muted; ctx.textAlign = 'right'; ctx.fillText(o.yf ? o.yf(v) : String(v), bx-6, y+4);
  }
  ctx.strokeStyle = tok('--rule'); ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx, by+bh); ctx.lineTo(bx+bw, by+bh); ctx.stroke();
  ctx.fillStyle = muted; ctx.font = `12px ${DISP}`;
  if (o.xl) { ctx.textAlign = 'center'; ctx.fillText(o.xl, bx+bw/2, by+bh+31); }
  if (o.yl) { ctx.save(); ctx.translate(13, by+bh/2); ctx.rotate(-Math.PI/2); ctx.textAlign = 'center'; ctx.fillText(o.yl, 0, 0); ctx.restore(); }
  return { X, Y, bx, by, bw, bh };
}
function clipBox(ctx, f) { ctx.save(); ctx.beginPath(); ctx.rect(f.bx, f.by, f.bw, f.bh); ctx.clip(); }

/* ---------- Modulverwaltung ---------- */
const mods = [];
const io = new IntersectionObserver(es => es.forEach(e => { if (e.target._mod) e.target._mod.visible = e.isIntersecting; }), { rootMargin: '100px' });
function reg(m) { m.visible = true; m.el._mod = m; io.observe(m.el); mods.push(m); new ResizeObserver(() => m.draw()).observe(m.el); return m; }
function redrawAll() { mods.forEach(m => m.draw()); }
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', redrawAll);
new MutationObserver(redrawAll).observe(root, { attributes: true, attributeFilter: ['data-theme'] });
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  for (const m of mods) if (m.anim && m.playing && m.visible) { m.step(dt); m.draw(); }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
function playBtn(btn, m) {
  btn.addEventListener('click', () => { m.playing = !m.playing; btn.textContent = m.playing ? 'Pause' : 'Abspielen'; });
  if (!m.playing) btn.textContent = 'Abspielen';
}

/* ---------- Spektren & Schwächung ---------- */
const WATER = [[10,5.33],[15,1.67],[20,0.81],[30,0.376],[40,0.268],[50,0.227],[60,0.206],[80,0.184],[100,0.171],[150,0.150]];
const BONE  = [[10,28.5],[15,9.0],[20,4.0],[30,1.33],[40,0.665],[50,0.424],[60,0.315],[80,0.223],[100,0.186],[150,0.148]];
const AL    = [[10,26.2],[15,7.96],[20,3.44],[30,1.13],[40,0.568],[50,0.368],[60,0.278],[80,0.202],[100,0.170],[150,0.138]];
const I_LO  = [[10,162],[15,61],[20,22.1],[25,12.3],[30,8.6],[33.16,6.55]];
const I_HI  = [[33.17,36.0],[40,22.1],[50,12.3],[60,7.6],[80,3.5],[100,1.94],[150,0.73]];
function mu(t, E) {
  if (E <= t[0][0]) return t[0][1];
  for (let i = 0; i < t.length-1; i++) if (E <= t[i+1][0]) {
    const [e0,m0] = t[i], [e1,m1] = t[i+1];
    const f = Math.log(E/e0) / Math.log(e1/e0);
    return Math.exp(Math.log(m0) + f*Math.log(m1/m0));
  }
  return t[t.length-1][1];
}
const muI = E => E < 33.17 ? mu(I_LO, E) : mu(I_HI, E);
const EG = []; for (let e = 10; e <= 150.001; e += 0.5) EG.push(Math.round(e*10)/10);
function tube(kvp) {
  const g = (E, c) => Math.exp(-0.5*((E-c)/0.45)**2);
  return EG.map(E => {
    if (E >= kvp) return 0;
    let n = (kvp - E) / E;
    if (kvp > 69.5) { const a = 1.3*(kvp-69.5)/50; n += a*(g(E,59.3) + 0.55*g(E,58.0) + 0.32*g(E,67.2)); }
    return n * Math.exp(-mu(AL, E)*2.7*0.6);
  });
}
function transmit(spec, waterCm, iodMgCm2) {
  return spec.map((n, i) => { const E = EG[i]; return n * Math.exp(-mu(WATER, E)*waterCm - muI(E)*iodMgCm2/1000); });
}
function sampler(spec) {
  const cdf = []; let s = 0; for (const v of spec) { s += v; cdf.push(s); }
  return () => {
    const u = Math.random()*s; let lo = 0, hi = cdf.length-1;
    while (lo < hi) { const m = (lo+hi) >> 1; if (cdf[m] < u) lo = m+1; else hi = m; }
    return EG[lo] + (Math.random()-0.5)*0.5;
  };
}
const BINC = ['--bin0','--bin1','--bin2','--bin3'];

/* ---------- Abb. 7: Charge Sharing / Fluoreszenz ---------- */
(() => {
  const cg = $('#cv-grid'), ch = $('#cv-hist');
  const iE = $('#mc-e'), iP = $('#mc-p'), iS = $('#mc-s'), iT = $('#mc-t'), iCS = $('#mc-cs'), iL = $('#mc-log');
  const NB = 220, BW = 0.5;
  let H, nPh, sumM, sumM2, recent, peak, visT;
  function P() { return { E: +iE.value, p: +iP.value, s: +iS.value, T: +iT.value, cs: iCS.checked }; }
  function reset() {
    const q = P();
    $('#mc-e-o').textContent = `${q.E} keV`; $('#mc-p-o').textContent = `${q.p} µm`; $('#mc-s-o').textContent = `${q.s} µm`; $('#mc-t-o').textContent = `${q.T} keV`;
    H = new Float64Array(NB); nPh = 0; sumM = 0; sumM2 = 0; recent = []; peak = 0; visT = 0;
    for (let i = 0; i < 3000; i++) one(false);
  }
  function one(keep) {
    const q = P(), p = q.p, sg = q.s, E0 = q.E;
    const x0 = (Math.random()-0.5)*p, y0 = (Math.random()-0.5)*p;
    const dep = []; let fl = null, Ep = E0;
    if (E0 > 26.71) {
      const el = (E0 > 31.81 && Math.random() < 0.5) ? 'Te' : 'Cd';
      const pk = 0.86*(el === 'Cd' ? 0.84 : 0.875);
      if (Math.random() < pk) {
        const EK = el === 'Cd' ? 23.1 : 27.5, lam = el === 'Cd' ? 115 : 60;
        const cz = 2*Math.random() - 1, ph = 2*Math.PI*Math.random(), s = -lam*Math.log(1 - Math.random());
        const r = s*Math.sqrt(1 - cz*cz);
        const x1 = x0 + r*Math.cos(ph), y1 = y0 + r*Math.sin(ph);
        Ep = E0 - EK; dep.push({ x: x1, y: y1, E: EK }); fl = { x1, y1, el };
      }
    }
    dep.unshift({ x: x0, y: y0, E: Ep });
    const px = new Float64Array(25), k2 = Math.SQRT2*sg;
    for (const d of dep) {
      const fx = [], fy = [];
      for (let k = -2; k <= 2; k++) {
        const lo = (k-0.5)*p, hi = (k+0.5)*p;
        fx.push(0.5*(erf((hi-d.x)/k2) - erf((lo-d.x)/k2)));
        fy.push(0.5*(erf((hi-d.y)/k2) - erf((lo-d.y)/k2)));
      }
      for (let j = 0; j < 5; j++) for (let i = 0; i < 5; i++) px[j*5+i] += d.E*fx[i]*fy[j];
    }
    const clean = Float64Array.from(px);
    for (let i = 0; i < 25; i++) px[i] += gauss()*1.0;
    const ev = [];
    if (q.cs) {
      let im = 0; for (let i = 1; i < 25; i++) if (px[i] > px[im]) im = i;
      const ix = im % 5, iy = (im/5) | 0; let sum = 0; const used = new Set();
      for (let j = iy-1; j <= iy+1; j++) for (let i = ix-1; i <= ix+1; i++) if (i >= 0 && i < 5 && j >= 0 && j < 5) { const v = px[j*5+i]; used.add(j*5+i); if (v > 3) sum += v; }
      if (sum > 5) ev.push(sum);
      for (let i = 0; i < 25; i++) if (!used.has(i) && px[i] > 5) ev.push(px[i]);
    } else {
      for (let i = 0; i < 25; i++) if (px[i] > 5) ev.push(px[i]);
    }
    let mcount = 0;
    for (const e of ev) { const b = Math.floor(e/BW); if (b >= 0 && b < NB) H[b]++; if (e >= q.T) mcount++; if (Math.abs(e - E0) < 3) peak++; }
    nPh++; sumM += mcount; sumM2 += mcount*mcount;
    if (keep) { recent.push({ x0, y0, dep, fl, px: clean, E0, t: 0 }); if (recent.length > 9) recent.shift(); }
  }
  function readout() {
    const mm = sumM/nPh, m2 = sumM2/nPh;
    $('#mc-read').innerHTML = `<span class="k">Photonen:</span> ${nf(nPh)}  <span class="k">·</span>  <span class="k">Zählungen ≥ Schwelle pro Photon:</span> ${nf(mm,3)}  <span class="k">·</span>  <span class="k">im Photopeak (±3 keV):</span> ${nf(peak/nPh*100,1)} %  <span class="k">·</span>  <span class="k">⟨m⟩²/⟨m²⟩:</span> ${nf(m2 ? mm*mm/m2 : 0,3)}`;
  }
  const mg = reg({ el: cg, anim: true, playing: !reduceMotion,
    step(dt) {
      if (nPh < 150000) for (let i = 0; i < 60; i++) one(false);
      visT += dt; if (visT > 0.45) { visT = 0; one(true); }
      recent.forEach(r => r.t += dt);
      mh.draw(); readout();
    },
    draw() {
      const { ctx, w, h } = fit(cg);
      const q = P(), size = Math.min(w, h) - 24, cell = size/5, ox = (w - size)/2, oy = 6;
      const s = cell/q.p;
      const fg = tok('--fg'), mut = tok('--muted'), acc = tok('--accent'), rule = tok('--rule');
      const lastR = recent[recent.length-1];
      for (let j = 0; j < 5; j++) for (let i = 0; i < 5; i++) {
        const x = ox + i*cell, y = oy + j*cell;
        if (lastR) { const fr = Math.min(1, lastR.px[j*5+i]/lastR.E0); if (fr > 0.01) { ctx.fillStyle = rgba(acc, 0.12 + 0.6*fr); ctx.fillRect(x, y, cell, cell); } }
        ctx.strokeStyle = (i === 2 && j === 2) ? fg : rule; ctx.lineWidth = (i === 2 && j === 2) ? 1.6 : 1;
        ctx.strokeRect(x + 0.5, y + 0.5, cell - 1, cell - 1);
      }
      const cx = ox + 2.5*cell, cy = oy + 2.5*cell;
      ctx.save(); ctx.beginPath(); ctx.rect(ox, oy, size, size); ctx.clip();
      recent.forEach((r, k) => {
        const a = Math.max(0.15, 1 - (recent.length - 1 - k)*0.11);
        r.dep.forEach((d, di) => {
          const X = cx + d.x*s, Y = cy + d.y*s;
          const rad = Math.max(2, 2*q.s*s);
          const grd = ctx.createRadialGradient(X, Y, 0, X, Y, rad);
          const cc = di === 0 ? tok('--elec') : tok('--bin2');
          grd.addColorStop(0, rgba(cc, 0.55*a)); grd.addColorStop(1, rgba(cc, 0));
          ctx.fillStyle = grd; ctx.beginPath(); ctx.arc(X, Y, rad, 0, 7); ctx.fill();
        });
        const X0 = cx + r.x0*s, Y0 = cy + r.y0*s;
        if (r.fl) {
          ctx.strokeStyle = rgba(tok('--bin2'), a); ctx.lineWidth = 1.4; ctx.setLineDash([4,3]);
          ctx.beginPath(); ctx.moveTo(X0, Y0); ctx.lineTo(cx + r.fl.x1*s, cy + r.fl.y1*s); ctx.stroke(); ctx.setLineDash([]);
          ctx.fillStyle = rgba(tok('--bin2'), a); ctx.beginPath(); ctx.arc(cx + r.fl.x1*s, cy + r.fl.y1*s, 3, 0, 7); ctx.fill();
          if (k === recent.length-1) { ctx.font = `11px ${MONO}`; ctx.fillStyle = fg; ctx.textAlign = 'left'; ctx.fillText(`${r.fl.el} Kα`, cx + r.fl.x1*s + 6, cy + r.fl.y1*s - 4); }
        }
        ctx.fillStyle = rgba(fg, a); ctx.beginPath(); ctx.arc(X0, Y0, 2.8, 0, 7); ctx.fill();
      });
      ctx.restore();
      // Maßstab
      const L = 100*s, by = oy + size + 12;
      ctx.strokeStyle = fg; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(ox, by); ctx.lineTo(ox + L, by); ctx.stroke();
      ctx.fillStyle = mut; ctx.font = `11px ${MONO}`; ctx.textAlign = 'left'; ctx.fillText('100 µm', ox + L + 6, by + 4);
    }
  });
  const mh = reg({ el: ch, draw() {
    const { ctx, w, h } = fit(ch);
    const q = P(), log = iL.checked;
    const xmax = Math.max(50, Math.ceil((q.E + 12)/10)*10);
    let mx = 1; for (let i = 0; i < NB; i++) if (i*BW <= xmax) mx = Math.max(mx, H[i]);
    const val = v => log ? Math.log10(1 + v)/Math.log10(1 + mx) : v/mx;
    const xt = []; for (let v = 0; v <= xmax; v += xmax > 80 ? 20 : 10) xt.push(v);
    const f = frame(ctx, w, h, { x0: 0, x1: xmax, y0: 0, y1: 1.08, xt, yt: [], xl: 'gemessene Energie pro Pixelereignis (keV)', yl: log ? 'Ereignisse (log)' : 'Ereignisse', l: 26 });
    clipBox(ctx, f);
    ctx.fillStyle = rgba(tok('--accent'), 0.85);
    for (let i = 0; i < NB; i++) { const e = i*BW; if (e > xmax) break; const v = val(H[i]); if (v <= 0) continue; ctx.fillRect(f.X(e), f.Y(v), Math.max(1, f.X(e+BW) - f.X(e)), f.Y(0) - f.Y(v)); }
    ctx.strokeStyle = tok('--hole'); ctx.lineWidth = 1.5; ctx.setLineDash([5,4]); ctx.beginPath(); ctx.moveTo(f.X(q.T), f.by); ctx.lineTo(f.X(q.T), f.by+f.bh); ctx.stroke(); ctx.setLineDash([]);
    ctx.restore();
    const marks = [[q.E, 'E₀']];
    if (q.E > 26.71) { marks.push([23.1, 'Cd Kα']); marks.push([q.E - 23.1, 'Esc Cd']); }
    if (q.E > 31.81) { marks.push([27.5, 'Te Kα']); marks.push([q.E - 27.5, 'Esc Te']); }
    ctx.font = `10px ${MONO}`; ctx.textAlign = 'center';
    const placed = [];
    marks.sort((a, b) => a[0] - b[0]).forEach(([e, t]) => {
      if (e < 5 || e > xmax) return;
      const x = f.X(e); let row = 0; while (placed.some(([px, pr]) => pr === row && Math.abs(px - x) < 40)) row++;
      placed.push([x, row]);
      ctx.fillStyle = tok('--muted'); ctx.fillRect(x - 0.5, f.by, 1, 6 + row*12);
      ctx.fillStyle = tok('--fg'); ctx.fillText(t, x, f.by + 16 + row*12);
    });
    ctx.fillStyle = tok('--hole'); ctx.textAlign = 'left'; ctx.fillText('Schwelle', f.X(q.T) + 4, f.by + f.bh - 6);
  }});
  [iE, iP, iS, iT, iCS].forEach(el => el.addEventListener('input', () => { reset(); mg.draw(); mh.draw(); readout(); }));
  iL.addEventListener('input', () => mh.draw());
  reset(); for (let i = 0; i < 6; i++) one(true); readout(); mg.draw(); mh.draw();
})();

})();
</script>
</body>
</html>
